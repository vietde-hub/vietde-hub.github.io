    :root {
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      min-height: 100dvh;
      padding-bottom: calc(76px + var(--safe-bottom));
    }
    @media (min-width: 768px) {
      body {
        padding-bottom: 40px;
      }
    }
    .bottom-nav-safe {
      padding-bottom: calc(6px + var(--safe-bottom));
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
    @keyframes pulseRing {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.45); }
      70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .btn-playing {
      background-color: #ef4444 !important;
      color: #ffffff !important;
      border-color: #ef4444 !important;
      animation: pulseRing 1.4s infinite;
    }
    @keyframes sheetSlideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .animate-sheet-up {
      animation: sheetSlideUp 0.26s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes popoverFade {
      from { opacity: 0; transform: translateY(-6px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-popover {
      animation: popoverFade 0.18s ease-out;

      { id: 31, cat: '1.2', de: 'das Schichtdickenmessgerät (-e)', ipa: '/das ˈʃɪçtdɪkənˌmɛsɡəˌʁɛːt/', type_vi: 'Danh từ (n.)', type_en: 'Noun (n.)', vi: 'Máy đo độ dày màng sơn', en: 'Coating thickness gauge', rel_vi: 'die Schichtdicke (dt: độ dày lớp sơn), messen (đt: đo)', rel_en: 'die Schichtdicke (n: film thickness), messen (v: to measure)', ex_de: 'Wir prüfen die Qualität mit dem Schichtdickenmessgerät.', ex_vi: 'Chúng ta kiểm tra chất lượng bằng máy đo độ dày màng sơn.', ex_en: 'We inspect the quality using the coating thickness gauge.' },
      { id: 32, cat: '1.2', de: 'das Hygrometer (-)', ipa: '/das hyɡʁoˈmeːtɐ/', type_vi: 'Danh từ (n.)', type_en: 'Noun (n.)', vi: 'Máy đo độ ẩm không khí & điểm sương', en: 'Hygrometer (humidity & dew point meter)', rel_vi: 'die Luftfeuchtigkeit (dt: độ ẩm không khí)', rel_en: 'die Luftfeuchtigkeit (n: air humidity)', ex_de: 'Laut Hygrometer liegt die Luftfeuchtigkeit heute bei 65 Prozent.', ex_vi: 'Theo máy đo độ ẩm, độ ẩm không khí hôm nay ở mức 65%.', ex_en: 'According to the hygrometer, the air humidity today is 65 percent.' },
      { id: 33, cat: '1.2', de: 'der Kran (-e) / die Hebebühne (-n)', ipa: '/deːɐ̯ kʁaːn/ / /diː ˈheːbəˌbyːnə/', type_vi: 'Danh từ (m./f.)', type_en: 'Noun (m./f.)', vi: 'Cần trục / Sàn nâng người làm việc trên cao', en: 'Crane / Aerial work platform (cherry picker)', rel_vi: 'heben (đt: nâng lên), der Kranführer (dt: thợ lái cẩu)', rel_en: 'heben (v: to lift), der Kranführer (n: crane operator)', ex_de: 'Für die oberen Teile des Turms benutzen wir die Hebebühne.', ex_vi: 'Đối với các phần phía trên của tháp, chúng ta dùng sàn nâng người.', ex_en: 'We use the aerial lift platform for the upper parts of the tower.' },

      // 1.3 Personal Protective Equipment - PPE (9)
      { id: 34, cat: '1.3', de: 'der Schutzanzug (-e) / der Einweganzug', ipa: '/deːɐ̯ ˈʃʊtsˌantsuːk/ / /deːɐ̯ ˈaɪnveːkˌantsuːk/', type_vi: 'Danh từ (m.)', type_en: 'Noun (m.)', vi: 'Quần áo bảo hộ / Đồ bảo hộ dùng một lần', en: 'Protective suit / Disposable coverall', rel_vi: 'schützen (đt: bảo vệ), der Anzug (dt: bộ đồ)', rel_en: 'schützen (v: to protect), der Anzug (n: suit)', ex_de: 'Ziehe vor dem Mischen der Farbe deinen Schutzanzug an.', ex_vi: 'Hãy mặc quần áo bảo hộ vào trước khi pha sơn.', ex_en: 'Put on your protective suit before mixing the paint.' },
      { id: 35, cat: '1.3', de: 'die Atemschutzmaske (-n)', ipa: '/diː ˈaːtəmʃʊtsˌmaskə/', type_vi: 'Danh từ (f.)', type_en: 'Noun (f.)', vi: 'Mặt nạ phòng độc / Khẩu trang lọc khí', en: 'Respirator mask', rel_vi: 'atmen (đt: thở), der Schutz (dt: sự bảo vệ), die Maske (dt: mặt nạ)', rel_en: 'atmen (v: to breathe), der Schutz (n: protection), die Maske (n: mask)', ex_de: 'Beim Arbeiten mit Lösungsmitteln ist die Atemschutzmaske Pflicht.', ex_vi: 'Khi làm việc với dung môi, bắt buộc phải đeo mặt nạ phòng độc.', ex_en: 'A respirator mask is mandatory when working with solvents.' },
      { id: 36, cat: '1.3', de: 'der Filter (-)', ipa: '/deːɐ̯ ˈfɪltɐ/', type_vi: 'Danh từ (m.)', type_en: 'Noun (m.)', vi: 'Phin lọc khí độc', en: 'Filter cartridge', rel_vi: 'filtern (đt: lọc)', rel_en: 'filtern (v: to filter)', ex_de: 'Mein Filter ist verbraucht, ich muss ihn wechseln.', ex_vi: 'Phin lọc của tôi đã dùng hết hạn rồi, tôi phải thay cái mới.', ex_en: 'My filter cartridge is used up; I have to replace it.' },
      { id: 37, cat: '1.3', de: 'die Schutzbrille (-n)', ipa: '/diː ˈʃʊtsˌbʁɪlə/', type_vi: 'Danh từ (f.)', type_en: 'Noun (f.)', vi: 'Kính bảo hộ', en: 'Safety goggles / Safety glasses', rel_vi: 'die Brille (dt: kính)', rel_en: 'die Brille (n: glasses)', ex_de: 'Trage beim Schleifen immer eine Schutzbrille.', ex_vi: 'Luôn đeo kính bảo hộ khi chà nhám.', ex_en: 'Always wear safety goggles when sanding.' },
      { id: 38, cat: '1.3', de: 'die Arbeitshandschuhe (Pl.)', ipa: '/diː ˈaʁbaɪtsˌhantʃuːə/', type_vi: 'Danh từ (Pl.)', type_en: 'Noun (Pl.)', vi: 'Găng tay bảo hộ', en: 'Work gloves / Protective gloves', rel_vi: 'die Arbeit (dt: công việc), der Handschuh (dt: găng tay)', rel_en: 'die Arbeit (n: work), der Handschuh (n: glove)', ex_de: 'Diese chemikalienbeständigen Arbeitshandschuhe schützen deine Hände.', ex_vi: 'Đôi găng tay bảo hộ chống hóa chất này bảo vệ đôi tay của bạn.', ex_en: 'These chemical-resistant work gloves protect your hands.' },
      { id: 39, cat: '1.3', de: 'die Sicherheitsschuhe (Pl.)', ipa: '/diː ˈzɪçɐhaɪtsˌʃuːə/', type_vi: 'Danh từ (Pl.)', type_en: 'Noun (Pl.)', vi: 'Giày bảo hộ mũi thép', en: 'Safety shoes / Steel-toe boots', rel_vi: 'die Sicherheit (dt: sự an toàn), der Schuh (dt: giày)', rel_en: 'die Sicherheit (n: safety), der Schuh (n: shoe)', ex_de: 'In der Werkhalle darf man nur mit Sicherheitsschuhen laufen.', ex_vi: 'Trong nhà xưởng chỉ được phép đi lại khi mang giày bảo hộ.', ex_en: 'You may only walk inside the workshop hall wearing safety shoes.' },
      { id: 40, cat: '1.3', de: 'der Gehörschutz', ipa: '/deːɐ̯ ɡəˈhøːɐ̯ˌʃʊts/', type_vi: 'Danh từ (m.)', type_en: 'Noun (m.)', vi: 'Nút bịt tai / Chụp tai chống ồn', en: 'Hearing protection / Ear defenders', rel_vi: 'hören (đt: nghe), das Gehör (dt: thính giác)', rel_en: 'hören (v: to hear), das Gehör (n: hearing)', ex_de: 'Wenn die Schleifmaschinen laufen, brauchen wir Gehörschutz.', ex_vi: 'Khi máy chà nhám hoạt động, chúng ta cần đồ bảo vệ thính giác.', ex_en: 'When the sanding machines are running, we need hearing protection.' },
      { id: 41, cat: '1.3', de: 'der Schutzhelm (-e)', ipa: '/deːɐ̯ ˈʃʊtsˌhɛlm/', type_vi: 'Danh từ (m.)', type_en: 'Noun (m.)', vi: 'Mũ bảo hộ lao động', en: 'Safety helmet / Hard hat', rel_vi: 'der Helm (dt: mũ bảo hiểm/bảo hộ)', rel_en: 'der Helm (n: helmet)', ex_de: 'Unter dem Kran musst du unbedingt deinen Schutzhelm tragen.', ex_vi: 'Ở phía dưới cần trục, bạn nhất định phải đội mũ bảo hộ.', ex_en: 'You must always wear your safety helmet under the crane.' },
      { id: 42, cat: '1.3', de: 'der Auffanggurt (-e)', ipa: '/deːɐ̯ ˈaʊfɡaŋˌɡʊʁt/', type_vi: 'Danh từ (m.)', type_en: 'Noun (m.)', vi: 'Dây đai an toàn toàn thân', en: 'Full-body safety harness', rel_vi: 'auffangen (đt: đỡ/chặn lại), der Gurt (dt: dây đai)', rel_en: 'auffangen (v: to catch/arrest), der Gurt (n: belt/harness)', ex_de: 'Sichere dich auf der Hebebühne immer mit dem Auffanggurt.', ex_vi: 'Luôn thắt dây đai an toàn tự bảo vệ khi đứng trên sàn nâng.', ex_en: 'Always secure yourself with the safety harness on the aerial lift.' },

      // 1.4 Technical Verbs & Adjectives (14)
      { id: 43, cat: '1.4', de: 'streichen / rollen', ipa: '/ˈʃtʁaɪçn̩/ / /ˈʁɔlən/', type_vi: 'Động từ', type_en: 'Verb', vi: 'Quét sơn / Lăn sơn', en: 'To brush-paint / To roll-paint', rel_vi: 'der Anstrich (dt: lớp sơn quét), die Farbrolle (dt: con lăn)', rel_en: 'der Anstrich (n: coat of paint), die Farbrolle (n: paint roller)', ex_de: 'Wir streichen die Ecken mit dem Pinsel und rollen die großen Flächen.', ex_vi: 'Chúng ta quét các góc bằng cọ và lăn các bề mặt lớn.', ex_en: 'We brush-paint the corners and roll the large surfaces.' },
      { id: 44, cat: '1.4', de: 'abkleben', ipa: '/ˈapˌkleːbn̩/', type_vi: 'Động từ (tách)', type_en: 'Verb (separable)', vi: 'Dán băng keo che chắn', en: 'To mask off / To tape off', rel_vi: 'kleben (đt: dán), das Abdeckband (dt: băng keo che)', rel_en: 'kleben (v: to stick/glue), das Abdeckband (n: masking tape)', ex_de: 'Ich habe alle Schrauben und Ränder schon abgeklebt.', ex_vi: 'Tôi đã dán băng keo che toàn bộ ốc vít và các mép xong rồi.', ex_en: 'I have already taped off all the bolts and edges.' },
      { id: 45, cat: '1.4', de: 'abdecken', ipa: '/ˈapˌdɛkn̩/', type_vi: 'Động từ (tách)', type_en: 'Verb (separable)', vi: 'Che phủ (bằng bạt/nilon)', en: 'To cover / To sheet off', rel_vi: 'decken (đt: che), die Abdeckfolie (dt: bạt che)', rel_en: 'decken (v: to cover), die Abdeckfolie (n: drop cloth)', ex_de: 'Bitte decke den Motor gut mit Folie ab.', ex_vi: 'Làm ơn che phủ động cơ thật kỹ bằng màng nilon.', ex_en: 'Please cover the motor thoroughly with plastic sheeting.' },
      { id: 46, cat: '1.4', de: 'messen / abmessen', ipa: '/ˈmɛsn̩/ / /ˈapˌmɛsn̩/', type_vi: 'Động từ', type_en: 'Verb', vi: 'Đo đạc / Đo kích thước', en: 'To measure / To measure out', rel_vi: 'die Messung (dt: phép đo), das Maßband (dt: thước dây)', rel_en: 'die Messung (n: measurement), das Maßband (n: measuring tape)', ex_de: 'Ich habe die Schichtdicke an fünf Punkten gemessen.', ex_vi: 'Tôi đã đo độ dày màng sơn tại năm điểm.', ex_en: 'I measured the coating thickness at five points.' },
      { id: 47, cat: '1.4', de: 'markieren / anzeichnen', ipa: '/maʁˈkiːʁən/ / /ˈanˌtsaɪçnən/', type_vi: 'Động từ', type_en: 'Verb', vi: 'Đánh dấu, xác định vị trí', en: 'To mark / To mark out', rel_vi: 'die Markierung (dt: dấu hiệu/vạch đánh dấu), zeichnen (đt: vẽ)', rel_en: 'die Markierung (n: marking), zeichnen (v: to draw)', ex_de: 'Markiere zuerst die Stelle, die nicht gestrichen werden darf.', ex_vi: 'Trước tiên hãy đánh dấu vị trí không được phép sơn.', ex_en: 'First mark the spot that must not be painted.' },
      { id: 48, cat: '1.4', de: 'schleifen / entrosten', ipa: '/ˈʃlaɪfn̩/ / /ɛntˈʁɔstn̩/', type_vi: 'Động từ', type_en: 'Verb', vi: 'Chà nhám / Đánh gỉ', en: 'To sand / To derust', rel_vi: 'der Schliff (dt: vết mài), das Schleifpapier (dt: giấy nhám)', rel_en: 'der Schliff (n: sanding/finish), das Schleifpapier (n: sandpaper)', ex_de: 'Wir müssen die Schweißnaht gründlich entrosten und glatt schleifen.', ex_vi: 'Chúng ta phải đánh sạch gỉ và chà nhẵn mối hàn thật kỹ.', ex_en: 'We must thoroughly remove rust from the weld seam and sand it smooth.' },
      { id: 49, cat: '1.4', de: 'reinigen / entfetten', ipa: '/ˈʁaɪnɪɡn̩/ / /ɛntˈfɛtn̩/', type_vi: 'Động từ', type_en: 'Verb', vi: 'Làm sạch / Tẩy dầu mỡ bề mặt', en: 'To clean / To degrease', rel_vi: 'rein (tt: sạch), die Reinigung (dt: việc làm sạch)', rel_en: 'rein (adj: clean/pure), die Reinigung (n: cleaning)', ex_de: 'Vor der Beschichtung wird der Stahl gereinigt und entfettet.', ex_vi: 'Trước khi sơn phủ, thép được làm sạch và tẩy dầu mỡ.', ex_en: 'Before coating, the steel is cleaned and degreased.' },
      { id: 50, cat: '1.4', de: 'mischen / anrühren', ipa: '/ˈmɪʃn̩/ / /ˈanˌʁyːʁən/', type_vi: 'Động từ', type_en: 'Verb', vi: 'Pha sơn / Khuấy đều sơn', en: 'To mix / To stir up', rel_vi: 'die Mischung (dt: hỗn hợp), das Rührgerät (dt: máy khuấy)', rel_en: 'die Mischung (n: mixture), das Rührgerät (n: mixer)', ex_de: 'Rühre die Farbe langsam an, damit keine Luftblasen entstehen.', ex_vi: 'Hãy khuấy sơn từ từ để không tạo ra bọt khí.', ex_en: 'Stir the paint slowly so that no air bubbles form.' },
      { id: 51, cat: '1.4', de: 'trocknen / aushärten', ipa: '/ˈtʁɔknən/ / /ˈaʊsˌhɛʁtn̩/', type_vi: 'Động từ', type_en: 'Verb', vi: 'Làm khô / Đóng rắn hoàn toàn', en: 'To dry / To cure completely', rel_vi: 'trocken (tt: khô), die Trocknungszeit (dt: thời gian khô)', rel_en: 'trocken (adj: dry), die Trocknungszeit (n: drying time)', ex_de: 'Die Grundierung muss vier Stunden trocknen.', ex_vi: 'Lớp sơn lót cần khô trong vòng bốn tiếng.', ex_en: 'The primer must dry for four hours.' },
      { id: 52, cat: '1.4', de: 'ausbessern', ipa: '/ˈaʊsˌbɛsɐn/', type_vi: 'Động từ (tách)', type_en: 'Verb (separable)', vi: 'Dặm vá, sửa lại chỗ sơn lỗi', en: 'To touch up / To repair defects', rel_vi: 'besser (tt: tốt hơn), die Ausbesserung (dt: việc sửa chữa/dặm vá)', rel_en: 'besser (adj: better), die Ausbesserung (n: touch-up/repair)', ex_de: 'Kleine Kratzer kann ich mit dem Pinsel ausbessern.', ex_vi: 'Những vết trầy xước nhỏ tôi có thể dùng cọ dặm lại được.', ex_en: 'I can touch up small scratches with the paintbrush.' },
      { id: 53, cat: '1.4', de: 'gleichmäßig / ungleichmäßig', ipa: '/ˈɡlaɪçˌmɛːsɪç/ / /ˈʊnɡlaɪçˌmɛːsɪç/', type_vi: 'Tính từ', type_en: 'Adjective', vi: 'Đều màu / Không đều', en: 'Even / Uneven', rel_vi: 'gleich (tt: giống nhau/bằng nhau)', rel_en: 'gleich (adj: equal/same)', ex_de: 'Trage den Lack sehr gleichmäßig auf.', ex_vi: 'Hãy phủ lớp sơn công nghiệp thật đều tay.', ex_en: 'Apply the industrial coating very evenly.' },
      { id: 54, cat: '1.4', de: 'trocken / feucht / nass', ipa: '/ˈtʁɔkn̩/ / /fɔʏçt/ / /nas/', type_vi: 'Tính từ', type_en: 'Adjective', vi: 'Khô / Ẩm / Ướt', en: 'Dry / Damp / Wet', rel_vi: 'die Feuchtigkeit (dt: độ ẩm), die Nässe (dt: sự ẩm ướt)', rel_en: 'die Feuchtigkeit (n: moisture/humidity), die Nässe (n: wetness)', ex_de: 'Ist die erste Schicht schon trocken genug zum Überrollen?', ex_vi: 'Lớp sơn đầu tiên đã đủ khô để lăn lớp tiếp theo chưa?', ex_en: 'Is the first coat dry enough yet to roll over?' },
      { id: 55, cat: '1.4', de: 'glatt / rau', ipa: '/ɡlat/ / /ʁaʊ/', type_vi: 'Tính từ', type_en: 'Adjective', vi: 'Nhẵn mịn / Nhám, thô ráp', en: 'Smooth / Rough', rel_vi: 'glätten (đt: làm nhẵn), die Rauheit (dt: độ nhám)', rel_en: 'glätten (v: to smooth), die Rauheit (n: roughness)', ex_de: 'Nach dem Schleifen fühlt sich das Metall ganz glatt an.', ex_vi: 'Sau khi chà nhám, bề mặt kim loại sờ vào rất nhẵn mịn.', ex_en: 'After sanding, the metal feels completely smooth.' },
      { id: 56, cat: '1.4', de: 'dick / dünn', ipa: '/dɪk/ / /dʏn/', type_vi: 'Tính từ', type_en: 'Adjective', vi: 'Dày / Mỏng', en: 'Thick / Thin', rel_vi: 'die Dicke (dt: độ dày), verdünnen (đt: pha loãng)', rel_en: 'die Dicke (n: thickness), verdünnen (v: to dilute/thin)', ex_de: 'Wenn die Farbe zu dick aufgetragen wird, entstehen Läufer.', ex_vi: 'Nếu sơn được phủ quá dày, sẽ xuất hiện các vết sơn chảy giọt.', ex_en: 'If the paint is applied too thickly, runs/sags will form.' }
    ];

    const PHRASES_DATA = [
      // 2.1 Receiving Tasks & Procedures (9)
      { id: 1, cat: '2.1', de: 'Was ist meine Aufgabe heute?', vi: 'Hôm nay nhiệm vụ của tôi là gì?', en: 'What is my task today?' },
      { id: 2, cat: '2.1', de: 'Welchen Bereich soll ich zuerst abkleben?', vi: 'Tôi nên dán băng keo che khu vực nào trước?', en: 'Which area should I mask off first?' },
      { id: 3, cat: '2.1', de: 'Welche Farbe / Grundierung nehmen wir dafür?', vi: 'Chúng ta dùng loại sơn / sơn lót nào cho phần này?', en: 'Which paint / primer are we using for this?' },
      { id: 4, cat: '2.1', de: 'In welchem Verhältnis muss ich die Farbe und den Härter mischen?', vi: 'Tôi phải pha sơn và chất đóng rắn theo tỷ lệ nào?', en: 'In what ratio do I need to mix the paint and hardener?' },
      { id: 5, cat: '2.1', de: 'Muss ich die Oberfläche vorher noch schleifen oder entfetten?', vi: 'Tôi có cần chà nhám hay tẩy dầu mỡ bề mặt này trước không?', en: 'Do I still need to sand or degrease the surface beforehand?' },
      { id: 6, cat: '2.1', de: 'Wie viele Schichten müssen wir streichen?', vi: 'Chúng ta phải sơn mấy lớp?', en: 'How many coats do we need to apply?' },
      { id: 7, cat: '2.1', de: 'Wie hoch muss die Schichtdicke sein?', vi: 'Độ dày màng sơn yêu cầu là bao nhiêu?', en: 'What must the coating thickness be?' },
      { id: 8, cat: '2.1', de: 'Wie lange muss die Farbe trocknen, bevor die nächste Schicht draufkommt?', vi: 'Sơn này cần khô trong bao lâu trước khi sơn lớp tiếp theo?', en: 'How long must the paint dry before the next coat goes on?' },
      { id: 9, cat: '2.1', de: 'Wo genau soll ich die Markierung setzen?', vi: 'Tôi nên đánh dấu vị trí chính xác ở đâu?', en: 'Where exactly should I place the marking?' },

      { id: 11, cat: '2.2', de: 'Die Oberfläche ist sauber und bereit zum Streichen.', vi: 'Bề mặt đã sạch và sẵn sàng để sơn.', en: 'The surface is clean and ready for painting.' },
      { id: 12, cat: '2.2', de: 'Die erste Schicht ist fertig.', vi: 'Lớp sơn đầu tiên đã xong.', en: 'The first coat is finished.' },

      return VOICE_CATALOG.find(v => v.id === voiceId) || VOICE_CATALOG[0];

    function showToast(msg) {
      const box = document.getElementById('statusToast');
      const txt = document.getElementById('statusToastText');
      if (!box || !txt) return;
      txt.textContent = msg;
      box.classList.remove('hidden');
      clearTimeout(audioCtrl.toastTimer);
      audioCtrl.toastTimer = setTimeout(() => {
        box.classList.add('hidden');
      }, 3000);
    }

    // =========================================================================
    // 4. AUDIO ENGINE WITH 4-TIER FALLBACK (audio/thoson/<voice>/<file>)
    // =========================================================================
    function syncPlayingButtonUI() {
      document.querySelectorAll('[data-audio-btn]').forEach(btn => {
        const id = btn.getAttribute('data-audio-btn');
        const isCurrent = audioCtrl.activeBtnId === id;
        const iconPlay = btn.querySelector('.icon-play');
        const iconStop = btn.querySelector('.icon-stop');
        if (isCurrent) {
          btn.classList.add('btn-playing');
          if (iconPlay) iconPlay.classList.add('hidden');
          if (iconStop) iconStop.classList.remove('hidden');
        } else {
          btn.classList.remove('btn-playing');
          if (iconPlay) iconPlay.classList.remove('hidden');
          if (iconStop) iconStop.classList.add('hidden');
        }
      });

      const fullBtn = document.getElementById('playFullDialogueBtn');
      if (fullBtn) {
        if (audioCtrl.isFullDialoguePlaying) {
          fullBtn.classList.add('bg-red-600', 'hover:bg-red-700');
          fullBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
          fullBtn.innerHTML = `<span>■</span> <span>${t('stopFullDialogue')}</span>`;
        } else {
          fullBtn.classList.remove('bg-red-600', 'hover:bg-red-700');
          fullBtn.classList.add('bg-blue-600', 'hover:bg-blue-700');
          fullBtn.innerHTML = `<span>▶</span> <span>${t('playFullDialogue')}</span>`;
        }
      }

      document.querySelectorAll('[data-preview-btn]').forEach(btn => {
        const isPrev = audioCtrl.activeBtnId === 'preview_sample';
        if (isPrev) {
          btn.classList.add('bg-red-600', 'text-white');
          btn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
          btn.innerHTML = `<span>■</span> <span>${t('stopPreviewBtn')}</span>`;
        } else {
          btn.classList.remove('bg-red-600');
          btn.classList.add('bg-blue-600', 'hover:bg-blue-700', 'text-white');
          btn.innerHTML = `<span>🔊</span> <span>${t('previewVoiceBtn')}</span>`;
        }
      });
    }

    function stopAllAudio(resetDialogue = true) {
      if (resetDialogue) {
        audioCtrl.dialogueStopFlag = true;
        audioCtrl.isFullDialoguePlaying = false;
      }
      if (audioCtrl.element) {
        audioCtrl.element.pause();
        audioCtrl.element.src = '';
        audioCtrl.element = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      audioCtrl.activeBtnId = null;
      document.querySelectorAll('.dialogue-line-active').forEach(el => {
        el.classList.remove('dialogue-line-active', 'ring-2', 'ring-blue-500', 'bg-blue-50/70');
      });
      syncPlayingButtonUI();
    }

    function playAudioWithFallback(fileName, fallbackText, voiceId, btnId, onEndedCallback = null) {
      if (audioCtrl.activeBtnId === btnId) {
        stopAllAudio(true);
        return;
      }

      stopAllAudio(false);
      audioCtrl.activeBtnId = btnId;
      syncPlayingButtonUI();

      const chain = [voiceId, 'piper_hochdeutsch', 'edge_hochdeutsch'].filter((v, idx, arr) => v && arr.indexOf(v) === idx);
      let attemptIdx = 0;

      const finishPlayback = () => {
        audioCtrl.activeBtnId = null;
        audioCtrl.element = null;
        syncPlayingButtonUI();
        if (onEndedCallback) onEndedCallback();
      };

      const tryNextSource = () => {
        if (attemptIdx >= chain.length) {
          if ('speechSynthesis' in window && fallbackText) {
            const utter = new SpeechSynthesisUtterance(fallbackText);
            utter.lang = 'de-DE';
            utter.rate = state.speed;
            utter.onend = finishPlayback;
            utter.onerror = finishPlayback;
            window.speechSynthesis.speak(utter);
          } else {
            finishPlayback();
          }
          return;
        }

        const currentVoice = chain[attemptIdx];
        const src = `${AUDIO_BASE_PATH}/${currentVoice}/${fileName}`;
        const audio = new Audio(src);
        audio.playbackRate = state.speed;
        audioCtrl.element = audio;

        audio.onended = finishPlayback;
        audio.onerror = () => {
          if (attemptIdx === 0 && currentVoice !== 'piper_hochdeutsch') {
            showToast(t('fallbackNotice'));
          }
          attemptIdx++;
          tryNextSource();
        };

        audio.play().catch(() => {
          attemptIdx++;
          tryNextSource();
        });
      };

      tryNextSource();
    }

    async function toggleFullDialogue() {
      if (audioCtrl.isFullDialoguePlaying) {
        stopAllAudio(true);
        return;
      }
      const dlg = DIALOGUES_DATA.find(d => d.id === state.activeDialogueId);
      if (!dlg) return;

      stopAllAudio(true);
      audioCtrl.isFullDialoguePlaying = true;
      audioCtrl.dialogueStopFlag = false;
      syncPlayingButtonUI();

      for (let i = 0; i < dlg.lines.length; i++) {
        if (audioCtrl.dialogueStopFlag) break;
        const line = dlg.lines[i];
        const lineNum = i + 1;
        const btnId = `dlg_${dlg.id}_line_${lineNum}`;
        const voice = line.role === 'worker' ? state.workerVoice : state.partnerVoice;

        document.querySelectorAll('.dialogue-line-active').forEach(el => {
          el.classList.remove('dialogue-line-active', 'ring-2', 'ring-blue-500', 'bg-blue-50/70');
        });
        const rowEl = document.getElementById(`row_${btnId}`);
        if (rowEl) {
          rowEl.classList.add('dialogue-line-active', 'ring-2', 'ring-blue-500', 'bg-blue-50/70');
          rowEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        await new Promise(resolve => {
          playAudioWithFallback(`dialog_${dlg.id}_line_${lineNum}.mp3`, line.de, voice, btnId, resolve);
        });

        if (!audioCtrl.dialogueStopFlag && i < dlg.lines.length - 1) {
          await new Promise(r => setTimeout(r, 350));
        }
      }

      stopAllAudio(true);
    }

      ];
      document.getElementById('fcCategorySelect').innerHTML = opts.map(o => `
        <option value="${o.id}" ${o.id === state.fcCategory ? 'selected' : ''}>${o.label}</option>
      `).join('');
    }

    function renderFlashcard() {
      renderFlashcardControls();
      if (state.fcDeck.length === 0) state.fcDeck = [...VOCAB_DATA];
      if (state.fcIndex >= state.fcDeck.length) state.fcIndex = 0;

      const card = state.fcDeck[state.fcIndex];
      const typeStr = state.lang === 'en' ? card.type_en : card.type_vi;
      const meaningStr = state.lang === 'en' ? card.en : card.vi;
      const relStr = state.lang === 'en' ? card.rel_en : card.rel_vi;
      const exTrans = state.lang === 'en' ? card.ex_en : card.ex_vi;
      const isMastered = state.masteredIds.includes(card.id);

      document.getElementById('fcCounter').textContent = `${state.fcIndex + 1} / ${state.fcDeck.length}`;

      const masterBtn = document.getElementById('fcMasterBtn');
      if (isMastered) {
        masterBtn.className = 'h-11 px-4 rounded-xl border border-emerald-300 bg-emerald-50 text-emerald-700 text-xs sm:text-sm font-bold shadow-xs flex items-center gap-1.5 transition cursor-pointer';
        masterBtn.innerHTML = `<span>✓</span> <span>${t('fcMastered')}</span>`;
      } else {
        masterBtn.className = 'h-11 px-4 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs sm:text-sm font-semibold shadow-xs flex items-center gap-1.5 transition cursor-pointer';
        masterBtn.innerHTML = `<span>○</span> <span>${t('fcMarkMastered')}</span>`;
      }

      const wordBtnId = `fc_word_${card.id}`;
      const exBtnId = `fc_ex_${card.id}`;

      document.getElementById('flashcardStage').innerHTML = `
        <div onclick="flipFlashcard()" class="relative w-full min-h-[310px] sm:min-h-[340px] cursor-pointer select-none">
          <div class="w-full min-h-[310px] sm:min-h-[340px] transform-style-3d ${state.fcFlipped ? 'rotate-y-180' : ''}">
            
            <!-- FRONT -->
            <div class="absolute inset-0 backface-hidden bg-white rounded-3xl p-6 sm:p-8 shadow-md border border-slate-200 flex flex-col items-center justify-between text-center">
              <div class="w-full flex items-center justify-between">
                <span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-blue-50 text-blue-700">${typeStr}</span>
                <div onclick="event.stopPropagation(); playAudioWithFallback('vocab_${card.id}_word.mp3', '${card.de.replace(/'/g, "\\'")}', state.globalVoice, '${wordBtnId}')">
                  ${speakBtnHTML(wordBtnId, 'w-11 h-11')}
                </div>
              </div>

              <div class="my-auto py-4">
                <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">${card.de}</h2>
                <p class="text-sm font-mono text-slate-400 mt-2">${card.ipa}</p>
              </div>

              <p class="text-xs font-medium text-slate-400">${t('fcFrontHint')}</p>
            </div>

            <!-- BACK -->
            <div class="absolute inset-0 backface-hidden rotate-y-180 bg-slate-900 text-white rounded-3xl p-6 sm:p-8 shadow-md border border-slate-800 flex flex-col justify-between">
              <div>
                <div class="flex items-start justify-between gap-2">
                  <div>
                    <p class="text-xs font-semibold text-amber-400 uppercase tracking-wider">${card.de}</p>
                    <h3 class="text-xl sm:text-2xl font-extrabold text-white mt-1">${meaningStr}</h3>
                  </div>
                  <button type="button" onclick="event.stopPropagation(); playAudioWithFallback('vocab_${card.id}_word.mp3', '${card.de.replace(/'/g, "\\'")}', state.globalVoice, '${wordBtnId}')"
                    class="h-10 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200 flex items-center gap-1.5 shrink-0 cursor-pointer">
                    <span>🔊</span> <span>${t('fcWordBtn')}</span>
                  </button>
                </div>

                <p class="text-xs text-slate-300 bg-slate-800/80 p-3 rounded-xl mt-3 leading-relaxed">
                  <span class="font-semibold text-amber-300">${t('relatedPrefix')}</span> ${relStr}
                </p>

                <div class="mt-3 p-3.5 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-between gap-3">
                  <div class="min-w-0">
                    <p class="text-xs sm:text-sm font-semibold text-white leading-snug">${card.ex_de}</p>
                    <p class="text-xs text-slate-300 italic mt-1">${exTrans}</p>
                  </div>
                  <button type="button" onclick="event.stopPropagation(); playAudioWithFallback('vocab_${card.id}_ex.mp3', '${card.ex_de.replace(/'/g, "\\'")}', state.globalVoice, '${exBtnId}')"
                    class="w-11 h-11 shrink-0 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 flex items-center justify-center font-bold cursor-pointer">
                    🔊
                  </button>
                </div>
              </div>

              <p class="text-center text-xs text-slate-400 mt-3">${t('fcBackHint')}</p>
            </div>

          </div>
        </div>
      `;

      syncPlayingButtonUI();
    }

    function flipFlashcard() {
      state.fcFlipped = !state.fcFlipped;
      renderFlashcard();
    }

    function nextFlashcard() {
      state.fcFlipped = false;
      state.fcIndex = (state.fcIndex + 1) % state.fcDeck.length;
      renderFlashcard();
    }

    function prevFlashcard() {
      state.fcFlipped = false;
      state.fcIndex = (state.fcIndex - 1 + state.fcDeck.length) % state.fcDeck.length;
      renderFlashcard();
    }

    function setFlashcardCategory(cat) {
      state.fcCategory = cat;
      state.fcFlipped = false;
      state.fcIndex = 0;
      state.fcDeck = cat === 'all' ? [...VOCAB_DATA] : VOCAB_DATA.filter(v => v.cat === cat);
      renderFlashcard();
    }

    function shuffleFlashcards() {
      for (let i = state.fcDeck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [state.fcDeck[i], state.fcDeck[j]] = [state.fcDeck[j], state.fcDeck[i]];
      }
      state.fcIndex = 0;
      state.fcFlipped = false;
      renderFlashcard();
    }

    function toggleFlashcardMastered() {
      const card = state.fcDeck[state.fcIndex];
      if (!card) return;
      const idx = state.masteredIds.indexOf(card.id);
      if (idx >= 0) {
        state.masteredIds.splice(idx, 1);
      } else {
        state.masteredIds.push(card.id);
      }
      localStorage.setItem('fd_mastered_thoson', JSON.stringify(state.masteredIds));
      renderFlashcard();
    }

    // =========================================================================
    // 7. LANGUAGE SWITCHER (100% UI + CONTENT LOCALIZATION)
    // =========================================================================
    function setLanguage(lang) {
      state.lang = lang;
      localStorage.setItem('fd_lang', lang);
      document.documentElement.lang = lang;

      const viBtn = document.getElementById('langBtnVi');
      const enBtn = document.getElementById('langBtnEn');
      if (lang === 'vi') {
        viBtn.className = 'h-full px-2.5 rounded-lg text-xs font-bold transition cursor-pointer bg-emerald-500 text-slate-950 shadow-xs';
        enBtn.className = 'h-full px-2.5 rounded-lg text-xs font-bold transition cursor-pointer text-slate-400 hover:text-white';
      } else {
        enBtn.className = 'h-full px-2.5 rounded-lg text-xs font-bold transition cursor-pointer bg-emerald-500 text-slate-950 shadow-xs';
        viBtn.className = 'h-full px-2.5 rounded-lg text-xs font-bold transition cursor-pointer text-slate-400 hover:text-white';
      }

      document.getElementById('backHomeText').textContent = t('backHomeText');
      document.getElementById('brandTitle').textContent = t('brandTitle');
      document.getElementById('popoverTitle').textContent = t('voiceSettingsTitle');
      document.getElementById('sheetTitle').textContent = t('voiceSettingsTitle');
      document.getElementById('vocabSearchInput').placeholder = t('searchPlaceholder');
      document.getElementById('workerVoiceLabel').textContent = t('workerVoiceLabel');
      document.getElementById('partnerVoiceLabel').textContent = t('partnerVoiceLabel');
      document.getElementById('fcShuffleText').textContent = t('fcShuffle');
      document.getElementById('fcPrevText').textContent = t('fcPrev');
      document.getElementById('fcNextText').textContent = t('fcNext');
      document.getElementById('fcShortcutHint').textContent = t('fcShortcutHint');

      renderNavigation();
      renderVoiceForms();
      renderVocab();
      renderPhrases();
      renderDialogues();
      renderFlashcard();
    }

    // =========================================================================
    // 8. KEYBOARD SHORTCUTS
    // =========================================================================
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && state.voiceDrawerOpen) {
        closeVoiceDrawer();
        return;
      }
      if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
      if (state.activeTab !== 'flashcards') return;

      const card = state.fcDeck[state.fcIndex];
      if (!card) return;

      if (e.code === 'Space') {
        e.preventDefault();
        flipFlashcard();
      } else if (e.key === 'ArrowRight') {
        nextFlashcard();
      } else if (e.key === 'ArrowLeft') {
        prevFlashcard();
      } else if (e.key.toLowerCase() === 's') {
        playAudioWithFallback(`vocab_${card.id}_word.mp3`, card.de, state.globalVoice, `fc_word_${card.id}`);
      } else if (e.key.toLowerCase() === 'e') {
        playAudioWithFallback(`vocab_${card.id}_ex.mp3`, card.ex_de, state.globalVoice, `fc_ex_${card.id}`);
      }
    });

    // =========================================================================
    // 9. INITIALIZE APP
    // =========================================================================
    setLanguage(state.lang);
  </script>
</body>
</html>
