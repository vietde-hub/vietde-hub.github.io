<!doctype html>

    <link

    <style>
      :root {
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background-color: #f1f5f9;
        color: #0f172a;
        min-height: 100dvh;
        padding-bottom: calc(76px + var(--safe-bottom));
      }
      @media (min-width: 768px) {
        body {
          padding-bottom: 40px;
        }
      }
      .bottom-nav-safe {
        padding-bottom: calc(6px + var(--safe-bottom));
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 9999px;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .perspective-1000 {
        perspective: 1000px;
      }
      .transform-style-3d {
        transform-style: preserve-3d;
        transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .backface-hidden {
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      .rotate-y-180 {
        transform: rotateY(180deg);
      }
      @keyframes pulseRing {
        0% {
          box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.45);
        }
        70% {
          box-shadow: 0 0 0 8px rgba(239, 68, 68, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
        }
      }
      .btn-playing {
        background-color: #ef4444 !important;
        color: #ffffff !important;
        border-color: #ef4444 !important;
        animation: pulseRing 1.4s infinite;
      }
      @keyframes sheetSlideUp {
        from {
          transform: translateY(100%);
        }
        to {
          transform: translateY(0);
        }
      }
      .animate-sheet-up {
        animation: sheetSlideUp 0.26s cubic-bezier(0.16, 1, 0.3, 1);
      }
      @keyframes popoverFade {
        from {
          opacity: 0;
          transform: translateY(-6px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .animate-popover {
        animation: popoverFade 0.18s ease-out;
      }
    </style>
  </head>
  <body class="antialiased selection:bg-rose-200 selection:text-slate-900">
    <!-- =====================================================================
       ADAPTIVE STICKY TOP BAR (Back to Hub + Compact Mobile + 1-Row Desktop)
       ===================================================================== -->
    <header
      class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md text-white border-b border-slate-800 shadow-sm"
    >

          <a

            <span>←</span>

            <div
              class="w-8 h-8 rounded-lg bg-rose-500 text-white flex items-center justify-center font-extrabold shadow-inner shrink-0"
            >
              <svg
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"

                <path

                  stroke-linejoin="round"

                />

            </div>
          </div>

          <!-- Desktop Single-Row Navigation Tabs (Hidden on Mobile) -->

        </div>

        <!-- Right: Voice Settings Trigger Pill + VI/EN Switch -->
        <div class="flex items-center gap-1.5 sm:gap-2.5 shrink-0 relative">
          <button

          >
            <span class="text-amber-400">🎙</span>
            <span
              id="voicePillLabel"
              class="max-w-[105px] sm:max-w-[160px] lg:max-w-[210px] truncate"
              >Piper Chuẩn Đức • 1.0x</span
            >
            <svg
              class="w-3.5 h-3.5 text-slate-400 shrink-0"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"

              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M19 9l-7 7-7-7"
              />
            </svg>

          <!-- Language Switcher VI | EN -->
          <div

            role="group"

            <button

              onclick="setLanguage('vi')"
              class="h-full px-2.5 rounded-lg text-xs font-bold transition cursor-pointer"

            <button
              id="langBtnEn"

              class="h-full px-2.5 rounded-lg text-xs font-bold transition cursor-pointer"

            </button>
          </div>

          <!-- DESKTOP POPOVER: Voice & Speed Controls -->
          <div

          >
            <div
              class="flex items-center justify-between pb-2.5 mb-3 border-b border-slate-100"
            >

    </header>

    <!-- Subtle Non-Blocking Audio Fallback / Status Banner -->

    >
      <span class="w-2 h-2 rounded-full bg-amber-400 shrink-0"></span>
      <span id="statusToastText" class="truncate"></span>
    </div>

    <!-- =====================================================================
       MAIN CONTENT AREA
       ===================================================================== -->
    <main class="max-w-7xl mx-auto px-3 sm:px-6 pt-4 sm:pt-6">
      <!-- TAB 1: VOCABULARY -->
      <section id="section-vocab" class="space-y-4">
        <div
          class="bg-white rounded-2xl p-3 sm:p-4 shadow-sm border border-slate-200/80 space-y-3"
        >
          <div class="relative">
            <svg
              class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 103.5 10.5a7.5 7.5 0 0013.15 6.15z"
              />

            <input
              id="vocabSearchInput"
              type="search"
              oninput="handleVocabSearch(this.value)"
              placeholder="Tìm từ tiếng Đức, nghĩa tiếng Việt..."

            />

              id="clearSearchBtn"
              type="button"
              onclick="clearVocabSearch()"

            >
              ✕
            </button>
          </div>

          <div
            id="vocabCategoryPills"
            class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5"
          ></div>
        </div>

        <div
          id="vocabGrid"
          class="grid grid-cols-1 md:grid-cols-2 gap-3 sm:gap-4"
        ></div>
      </section>

      <!-- TAB 2: NURSING PHRASES -->
      <section id="section-phrases" class="hidden space-y-4">
        <div
          class="bg-white rounded-2xl p-3 sm:p-4 shadow-sm border border-slate-200/80"
        >
          <div
            id="phraseCategoryPills"
            class="flex items-center gap-1.5 overflow-x-auto no-scrollbar"
          ></div>
        </div>
        <div
          id="phrasesList"
          class="grid grid-cols-1 md:grid-cols-2 gap-3"
        ></div>
      </section>

      <!-- TAB 3: DIALOGUES -->
      <section id="section-dialogues" class="hidden space-y-4">
        <div
          class="bg-white rounded-2xl p-3.5 sm:p-5 shadow-sm border border-slate-200/80 space-y-4"
        >
          <div
            id="dialogueTabs"
            class="flex items-center gap-2 overflow-x-auto no-scrollbar"
          ></div>

          <div
            class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2 border-t border-slate-100"
          >
            <div>
              <label
                id="workerVoiceLabel"
                class="block text-xs font-semibold text-slate-600 mb-1"
                >Giọng Điều dưỡng viên (Đức)</label
              >
              <select
                id="workerVoiceSelect"
                onchange="updateDialogueVoice('worker', this.value)"
                class="w-full h-10 px-3 rounded-xl bg-slate-50 border border-slate-200 text-xs sm:text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500"

            <div>

              >
              <select
                id="partnerVoiceSelect"
                onchange="updateDialogueVoice('partner', this.value)"
                class="w-full h-10 px-3 rounded-xl bg-slate-50 border border-slate-200 text-xs sm:text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500"
              ></select>
            </div>
          </div>
        </div>

        <div
          id="dialogueContainer"
          class="bg-white rounded-2xl p-4 sm:p-6 shadow-sm border border-slate-200/80"
        ></div>
      </section>

      <!-- TAB 4: FLASHCARDS -->
      <section
        id="section-flashcards"
        class="hidden space-y-4 max-w-2xl mx-auto"
      >
        <div
          class="bg-white rounded-2xl p-3 sm:p-4 shadow-sm border border-slate-200/80 flex flex-wrap items-center justify-between gap-2"
        >

            onchange="setFlashcardCategory(this.value)"
            class="h-10 px-3 rounded-xl bg-slate-50 border border-slate-200 text-xs sm:text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500"
          ></select>
          <div class="flex items-center gap-2">
            <span
              id="fcCounter"
              class="text-xs font-bold text-slate-600 bg-slate-100 px-3 py-2 rounded-xl"
              >1 / 88</span
            >
            <button
              id="fcShuffleBtn"
              type="button"
              onclick="shuffleFlashcards()"
              class="h-10 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold flex items-center gap-1.5 transition cursor-pointer"
            >
              <span>🔀</span>
              <span id="fcShuffleText">Trộn thẻ</span>
            </button>
          </div>
        </div>

        <div id="flashcardStage" class="perspective-1000"></div>

        <div class="flex items-center justify-between gap-2">
          <button
            type="button"
            onclick="prevFlashcard()"
            class="h-11 px-4 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-sm font-semibold text-slate-700 shadow-sm flex items-center gap-1.5 cursor-pointer"
          >
            <span>←</span>
            <span id="fcPrevText">Trước</span>
          </button>

          <button
            id="fcMasterBtn"
            type="button"
            onclick="toggleFlashcardMastered()"
            class="h-11 px-4 rounded-xl border text-xs sm:text-sm font-semibold shadow-sm flex items-center gap-1.5 transition cursor-pointer"

          <button
            type="button"
            onclick="nextFlashcard()"
            class="h-11 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-sm font-semibold text-white shadow-sm flex items-center gap-1.5 cursor-pointer"
          >
            <span id="fcNextText">Tiếp</span>
            <span>→</span>
          </button>
        </div>

        <p
          id="fcShortcutHint"
          class="hidden md:block text-center text-xs text-slate-400"
        >
          Phím tắt: Space (Lật thẻ) • ← / → (Chuyển thẻ) • S (Nghe từ) • E (Nghe
          ví dụ)
        </p>
      </section>

      <!-- PRACTICAL NURSING NOTES CARD (FROM GOOGLE DOC) -->
      <section
        id="section-nursing-notes"
        class="mt-6 bg-white rounded-2xl p-4 sm:p-6 shadow-xs border border-slate-200/80"
      >
        <h2
          id="notesHeading"
          class="text-base sm:text-lg font-extrabold text-slate-900 mb-3"
        ></h2>
        <ul
          id="notesList"
          class="space-y-2.5 text-xs sm:text-sm text-slate-700 leading-relaxed"
        ></ul>
      </section>
    </main>

    <!-- MOBILE BOTTOM NAVIGATION BAR -->
    <nav

    <div

      onclick="closeVoiceDrawer()"
      class="hidden md:hidden fixed inset-0 z-50 bg-slate-950/50 backdrop-blur-xs transition-opacity"
    ></div>
    <div

      class="hidden md:hidden fixed inset-x-0 bottom-0 z-50 bg-white rounded-t-3xl shadow-2xl border-t border-slate-200 p-5 pb-[calc(20px+var(--safe-bottom))] animate-sheet-up"
    >

      <div class="flex items-center justify-between mb-3">
        <h3 id="sheetTitle" class="text-base font-bold text-slate-900">
          Cài đặt Giọng đọc & Tốc độ
        </h3>
        <button
          type="button"
          onclick="closeVoiceDrawer()"
          class="w-9 h-9 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center font-bold"
        >
          ✕
        </button>
      </div>
      <div id="mobileVoiceForm"></div>
    </div>

      // =========================================================================
      // 4. AUDIO ENGINE WITH FALLBACK (audio/dieuduong/<voice>/<file>)
      // =========================================================================
      function syncPlayingButtonUI() {
        document.querySelectorAll("[data-audio-btn]").forEach((btn) => {
          const id = btn.getAttribute("data-audio-btn");
          const isCurrent = audioCtrl.activeBtnId === id;
          const iconPlay = btn.querySelector(".icon-play");
          const iconStop = btn.querySelector(".icon-stop");
          if (isCurrent) {
            btn.classList.add("btn-playing");
            if (iconPlay) iconPlay.classList.add("hidden");
            if (iconStop) iconStop.classList.remove("hidden");
          } else {
            btn.classList.remove("btn-playing");
            if (iconPlay) iconPlay.classList.remove("hidden");
            if (iconStop) iconStop.classList.add("hidden");
          }
        });

        const fullBtn = document.getElementById("playFullDialogueBtn");
        if (fullBtn) {
          if (audioCtrl.isFullDialoguePlaying) {
            fullBtn.classList.add("bg-red-600", "hover:bg-red-700");
            fullBtn.classList.remove("bg-blue-600", "hover:bg-blue-700");
            fullBtn.innerHTML = `<span>■</span> <span>${t("stopFullDialogue")}</span>`;
          } else {
            fullBtn.classList.remove("bg-red-600", "hover:bg-red-700");
            fullBtn.classList.add("bg-blue-600", "hover:bg-blue-700");
            fullBtn.innerHTML = `<span>▶</span> <span>${t("playFullDialogue")}</span>`;
          }
        }

        document.querySelectorAll("[data-preview-btn]").forEach((btn) => {
          const isPrev = audioCtrl.activeBtnId === "preview_sample";
          if (isPrev) {
            btn.classList.add("bg-red-600", "text-white");
            btn.classList.remove("bg-blue-600", "hover:bg-blue-700");
            btn.innerHTML = `<span>■</span> <span>${t("stopPreviewBtn")}</span>`;
          } else {
            btn.classList.remove("bg-red-600");
            btn.classList.add("bg-blue-600", "hover:bg-blue-700", "text-white");
            btn.innerHTML = `<span>🔊</span> <span>${t("previewVoiceBtn")}</span>`;
          }
        });
      }

      function stopAllAudio(resetDialogue = true) {
        if (resetDialogue) {
          audioCtrl.dialogueStopFlag = true;
          audioCtrl.isFullDialoguePlaying = false;
        }
        if (audioCtrl.element) {
          audioCtrl.element.pause();
          audioCtrl.element.src = "";
          audioCtrl.element = null;
        }
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        }
        audioCtrl.activeBtnId = null;
        document.querySelectorAll(".dialogue-line-active").forEach((el) => {
          el.classList.remove(
            "dialogue-line-active",
            "ring-2",
            "ring-blue-500",
            "bg-blue-50/70",
          );
        });
        syncPlayingButtonUI();
      }

      function playAudioWithFallback(
        fileName,
        fallbackText,
        voiceId,
        btnId,
        onEndedCallback = null,
      ) {
        if (audioCtrl.activeBtnId === btnId) {
          stopAllAudio(true);
          return;
        }

        stopAllAudio(false);
        audioCtrl.activeBtnId = btnId;
        syncPlayingButtonUI();

        const chain = [voiceId, "piper_hochdeutsch", "edge_hochdeutsch"].filter(
          (v, idx, arr) => v && arr.indexOf(v) === idx,
        );
        let attemptIdx = 0;

        const finishPlayback = () => {
          audioCtrl.activeBtnId = null;
          audioCtrl.element = null;
          syncPlayingButtonUI();
          if (onEndedCallback) onEndedCallback();
        };

        const tryNextSource = () => {
          if (attemptIdx >= chain.length) {
            if ("speechSynthesis" in window && fallbackText) {
              const utter = new SpeechSynthesisUtterance(fallbackText);
              utter.lang = "de-DE";
              utter.rate = state.speed;
              utter.onend = finishPlayback;
              utter.onerror = finishPlayback;
              window.speechSynthesis.speak(utter);
            } else {
              finishPlayback();
            }
            return;
          }

          const currentVoice = chain[attemptIdx];
          const src = `${AUDIO_BASE_PATH}/${currentVoice}/${fileName}`;
          const audio = new Audio(src);
          audio.playbackRate = state.speed;
          audioCtrl.element = audio;

          audio.onended = finishPlayback;
          audio.onerror = () => {
            if (attemptIdx === 0 && currentVoice !== "piper_hochdeutsch") {
              showToast(t("fallbackNotice"));
            }
            attemptIdx++;
            tryNextSource();
          };

          audio.play().catch(() => {
            attemptIdx++;
            tryNextSource();
          });
        };

        tryNextSource();
      }

      async function toggleFullDialogue() {
        if (audioCtrl.isFullDialoguePlaying) {
          stopAllAudio(true);
          return;
        }
        const dlg = DIALOGUES_DATA.find((d) => d.id === state.activeDialogueId);
        if (!dlg) return;

        stopAllAudio(true);
        audioCtrl.isFullDialoguePlaying = true;
        audioCtrl.dialogueStopFlag = false;
        syncPlayingButtonUI();

        for (let i = 0; i < dlg.lines.length; i++) {
          if (audioCtrl.dialogueStopFlag) break;
          const line = dlg.lines[i];
          const lineNum = i + 1;
          const btnId = `dlg_${dlg.id}_line_${lineNum}`;
          const voice =
            line.role === "worker" ? state.workerVoice : state.partnerVoice;

          document.querySelectorAll(".dialogue-line-active").forEach((el) => {
            el.classList.remove(
              "dialogue-line-active",
              "ring-2",
              "ring-blue-500",
              "bg-blue-50/70",
            );
          });
          const rowEl = document.getElementById(`row_${btnId}`);
          if (rowEl) {
            rowEl.classList.add(
              "dialogue-line-active",
              "ring-2",
              "ring-blue-500",
              "bg-blue-50/70",
            );
            rowEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
          }

          await new Promise((resolve) => {
            playAudioWithFallback(
              `dialog_${dlg.id}_line_${lineNum}.mp3`,
              line.de,
              voice,
              btnId,
              resolve,
            );
          });

          if (!audioCtrl.dialogueStopFlag && i < dlg.lines.length - 1) {
            await new Promise((r) => setTimeout(r, 350));
          }
        }

        stopAllAudio(true);
      }

          { id: "all", label: `${t("cat_all")} (${VOCAB_DATA.length})` },
          { id: "1.1", label: `${t("cat_1_1")} (${countCat("1.1")})` },
          { id: "1.2", label: `${t("cat_1_2")} (${countCat("1.2")})` },
          { id: "1.3", label: `${t("cat_1_3")} (${countCat("1.3")})` },
          { id: "1.4", label: `${t("cat_1_4")} (${countCat("1.4")})` },
          { id: "1.5", label: `${t("cat_1_5")} (${countCat("1.5")})` },
        ];

        document.getElementById("vocabCategoryPills").innerHTML = cats
          .map(
            (c) => `
        <button type="button" onclick="setVocabCategory('${c.id}')"
          class="px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition cursor-pointer ${state.vocabCategory === c.id ? "bg-blue-600 text-white shadow-xs" : "bg-slate-100 text-slate-600 hover:bg-slate-200"}">
          ${c.label}
        </button>
      `,
          )
          .join("");

        const q = normalizeSearch(state.vocabQuery);
        const filtered = VOCAB_DATA.filter((item) => {
          const matchCat =
            state.vocabCategory === "all" || item.cat === state.vocabCategory;
          if (!matchCat) return false;
          if (!q) return true;
          const haystack = normalizeSearch(
            `${item.de} ${item.vi} ${item.en} ${item.rel_vi} ${item.rel_en} ${item.ex_de} ${item.ex_vi} ${item.ex_en}`,
          );
          return haystack.includes(q);
        });

        const grid = document.getElementById("vocabGrid");
        if (filtered.length === 0) {
          grid.innerHTML = `<div class="col-span-full bg-white rounded-2xl p-8 text-center text-sm text-slate-500 border border-slate-200">${t("noResults")}</div>`;
          return;
        }

        grid.innerHTML = filtered
          .map((item) => {
            const typeStr = state.lang === "en" ? item.type_en : item.type_vi;
            const meaningStr = state.lang === "en" ? item.en : item.vi;
            const relStr = state.lang === "en" ? item.rel_en : item.rel_vi;
            const exTrans = state.lang === "en" ? item.ex_en : item.ex_vi;
            const wordBtnId = `vocab_${item.id}_word`;
            const exBtnId = `vocab_${item.id}_ex`;

            return `
          <article class="bg-white rounded-2xl p-4 sm:p-5 shadow-xs border border-slate-200/80 hover:border-blue-300 transition flex flex-col justify-between gap-3.5">
            <div>
              <div class="flex items-start justify-between gap-3">
                <div class="min-w-0">
                  <div class="flex flex-wrap items-center gap-2">
                    <h2 class="text-base sm:text-lg font-bold text-slate-900 leading-snug">${item.de}</h2>
                    <span class="px-2 py-0.5 rounded-md text-[11px] font-semibold bg-blue-50 text-blue-700 border border-blue-100">${typeStr}</span>
                  </div>
                  <p class="text-xs font-mono text-slate-400 mt-0.5">${item.ipa}</p>
                  <p class="text-sm sm:text-base font-bold text-emerald-700 mt-1.5">${meaningStr}</p>
                </div>
                <div onclick="playAudioWithFallback('vocab_${item.id}_word.mp3', '${item.de.replace(/'/g, "\'")}', state.globalVoice, '${wordBtnId}')">
                  ${speakBtnHTML(wordBtnId, "w-11 h-11")}
                </div>
              </div>

              <div class="mt-2.5 px-3 py-2 rounded-xl bg-slate-50 border border-slate-100 text-xs text-slate-600 leading-relaxed">
                <span class="font-semibold text-slate-700">${t("relatedPrefix")}</span> ${relStr}
              </div>
            </div>

            <div class="p-3 rounded-xl bg-rose-50/70 border border-rose-200/60 flex items-center justify-between gap-3">
              <div class="min-w-0">
                <p class="text-xs sm:text-sm font-semibold text-slate-800 leading-snug">${item.ex_de}</p>
                <p class="text-xs text-slate-600 italic mt-0.5 leading-snug">${exTrans}</p>
              </div>
              <div onclick="playAudioWithFallback('vocab_${item.id}_ex.mp3', '${item.ex_de.replace(/'/g, "\'")}', state.globalVoice, '${exBtnId}')">
                ${speakBtnHTML(exBtnId, "w-11 h-11 bg-rose-100/80 hover:bg-rose-200/80 text-rose-800 border-rose-200")}
              </div>
            </div>
          </article>
        `;
          })
          .join("");

        syncPlayingButtonUI();
      }

      function setVocabCategory(cat) {
        state.vocabCategory = cat;
        renderVocab();
      }

      function handleVocabSearch(val) {
        state.vocabQuery = val;
        const clearBtn = document.getElementById("clearSearchBtn");
        if (clearBtn) {
          clearBtn.classList.toggle("hidden", !val);
          clearBtn.classList.toggle("flex", Boolean(val));
        }
        renderVocab();
      }

      function clearVocabSearch() {
        const input = document.getElementById("vocabSearchInput");
        if (input) input.value = "";
        handleVocabSearch("");
      }

      function renderPhrases() {
        const countPCat = (cat) =>
          PHRASES_DATA.filter((p) => p.cat === cat).length;
        const cats = [
          { id: "all", label: `${t("pcat_all")} (${PHRASES_DATA.length})` },
          { id: "2.1", label: `${t("pcat_2_1")} (${countPCat("2.1")})` },
          { id: "2.2", label: `${t("pcat_2_2")} (${countPCat("2.2")})` },
          { id: "2.3", label: `${t("pcat_2_3")} (${countPCat("2.3")})` },
          { id: "2.4", label: `${t("pcat_2_4")} (${countPCat("2.4")})` },
        ];

        document.getElementById("phraseCategoryPills").innerHTML = cats
          .map(
            (c) => `
        <button type="button" onclick="setPhraseCategory('${c.id}')"
          class="px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition cursor-pointer ${state.phraseCategory === c.id ? "bg-blue-600 text-white shadow-xs" : "bg-slate-100 text-slate-600 hover:bg-slate-200"}">
          ${c.label}
        </button>
      `,
          )
          .join("");

        const filtered = PHRASES_DATA.filter(
          (p) =>
            state.phraseCategory === "all" || p.cat === state.phraseCategory,
        );
        document.getElementById("phrasesList").innerHTML = filtered
          .map((p) => {
            const trans = state.lang === "en" ? p.en : p.vi;
            const btnId = `phrase_${p.id}`;
            return `
          <div class="bg-white rounded-2xl p-4 shadow-xs border border-slate-200/80 hover:border-blue-300 transition flex items-center justify-between gap-3.5">
            <div class="min-w-0">
              <span class="inline-block text-[11px] font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md mb-1">${p.cat}</span>
              <p class="text-sm sm:text-base font-bold text-slate-900 leading-snug">${p.de}</p>
              <p class="text-xs sm:text-sm text-slate-600 mt-1">${trans}</p>
            </div>
            <div onclick="playAudioWithFallback('phrase_${p.id}.mp3', '${p.de.replace(/'/g, "\'")}', state.globalVoice, '${btnId}')">
              ${speakBtnHTML(btnId, "w-11 h-11")}
            </div>
          </div>
        `;
          })
          .join("");

        syncPlayingButtonUI();
      }

      function setPhraseCategory(cat) {
        state.phraseCategory = cat;
        renderPhrases();
      }

      function renderDialogues() {
        document.getElementById("dialogueTabs").innerHTML = DIALOGUES_DATA.map(
          (d) => {
            const label = state.lang === "en" ? d.tab_en : d.tab_vi;
            const active = d.id === state.activeDialogueId;
            return `
          <button type="button" onclick="selectDialogue(${d.id})"
            class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition cursor-pointer ${active ? "bg-slate-900 text-white shadow-xs" : "bg-slate-100 text-slate-600 hover:bg-slate-200"}">
            ${label}
          </button>
        `;
          },
        ).join("");

        const dlg =
          DIALOGUES_DATA.find((d) => d.id === state.activeDialogueId) ||
          DIALOGUES_DATA[0];
        const title = state.lang === "en" ? dlg.title_en : dlg.title_vi;
        const context = state.lang === "en" ? dlg.context_en : dlg.context_vi;

        document.getElementById("dialogueContainer").innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 mb-4 border-b border-slate-100">
          <div>
            <h2 class="text-base sm:text-lg font-bold text-slate-900">${title}</h2>
            <p class="text-xs sm:text-sm text-slate-500 mt-0.5">${context}</p>
          </div>
          <button id="playFullDialogueBtn" type="button" onclick="toggleFullDialogue()"
            class="h-11 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs sm:text-sm font-bold flex items-center justify-center gap-2 shrink-0 shadow-xs transition cursor-pointer">
            <span>▶</span> <span>${t("playFullDialogue")}</span>
          </button>
        </div>

        <div class="space-y-3">
          ${dlg.lines
            .map((line, idx) => {
              const lineNum = idx + 1;
              const btnId = `dlg_${dlg.id}_line_${lineNum}`;
              const speakerName =
                state.lang === "en" ? line.name_en : line.name_vi;
              const lineTrans = state.lang === "en" ? line.en : line.vi;
              const isWorker = line.role === "worker";
              const voiceForLine = isWorker
                ? state.workerVoice
                : state.partnerVoice;

              return `
              <div id="row_${btnId}" class="p-3.5 sm:p-4 rounded-2xl border transition flex items-start justify-between gap-3 ${isWorker ? "bg-slate-50/90 border-slate-200/80" : "bg-rose-50/50 border-rose-200/60"}">
                <div class="min-w-0">
                  <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-bold mb-1 ${isWorker ? "bg-blue-100 text-blue-800" : "bg-rose-100 text-rose-900"}">
                    ${speakerName}
                  </span>
                  <p class="text-sm sm:text-base font-bold text-slate-900 leading-snug">${line.de}</p>
                  <p class="text-xs sm:text-sm text-slate-600 mt-1">${lineTrans}</p>
                </div>
                <div onclick="playAudioWithFallback('dialog_${dlg.id}_line_${lineNum}.mp3', '${line.de.replace(/'/g, "\'")}', '${voiceForLine}', '${btnId}')">
                  ${speakBtnHTML(btnId, "w-11 h-11")}
                </div>
              </div>
            `;
            })
            .join("")}
        </div>
      `;

        syncPlayingButtonUI();
      }

      function selectDialogue(id) {
        stopAllAudio(true);
        state.activeDialogueId = id;
        renderDialogues();
      }

      function renderFlashcardControls() {
        const countCat = (cat) =>
          VOCAB_DATA.filter((v) => v.cat === cat).length;
        const cardUnit = state.lang === "en" ? "cards" : "thẻ";
        const opts = [
          {
            id: "all",
            label: `${t("fcAllCategories")} (${VOCAB_DATA.length} ${cardUnit})`,
          },
          { id: "1.1", label: `${t("cat_1_1")} (${countCat("1.1")})` },
          { id: "1.2", label: `${t("cat_1_2")} (${countCat("1.2")})` },
          { id: "1.3", label: `${t("cat_1_3")} (${countCat("1.3")})` },
          { id: "1.4", label: `${t("cat_1_4")} (${countCat("1.4")})` },
          { id: "1.5", label: `${t("cat_1_5")} (${countCat("1.5")})` },
        ];
        document.getElementById("fcCategorySelect").innerHTML = opts
          .map(
            (o) => `
        <option value="${o.id}" ${o.id === state.fcCategory ? "selected" : ""}>${o.label}</option>
      `,
          )
          .join("");
      }

      function renderFlashcard() {
        renderFlashcardControls();
        if (state.fcDeck.length === 0) state.fcDeck = [...VOCAB_DATA];
        if (state.fcIndex >= state.fcDeck.length) state.fcIndex = 0;

        const card = state.fcDeck[state.fcIndex];
        const typeStr = state.lang === "en" ? card.type_en : card.type_vi;
        const meaningStr = state.lang === "en" ? card.en : card.vi;
        const relStr = state.lang === "en" ? card.rel_en : card.rel_vi;
        const exTrans = state.lang === "en" ? card.ex_en : card.ex_vi;
        const isMastered = state.masteredIds.includes(card.id);

        document.getElementById("fcCounter").textContent =
          `${state.fcIndex + 1} / ${state.fcDeck.length}`;

        const masterBtn = document.getElementById("fcMasterBtn");
        if (isMastered) {
          masterBtn.className =
            "h-11 px-4 rounded-xl border border-emerald-300 bg-emerald-50 text-emerald-700 text-xs sm:text-sm font-bold shadow-xs flex items-center gap-1.5 transition cursor-pointer";
          masterBtn.innerHTML = `<span>✓</span> <span>${t("fcMastered")}</span>`;
        } else {
          masterBtn.className =
            "h-11 px-4 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs sm:text-sm font-semibold shadow-xs flex items-center gap-1.5 transition cursor-pointer";
          masterBtn.innerHTML = `<span>○</span> <span>${t("fcMarkMastered")}</span>`;
        }

        const wordBtnId = `fc_word_${card.id}`;
        const exBtnId = `fc_ex_${card.id}`;

        document.getElementById("flashcardStage").innerHTML = `
        <div onclick="flipFlashcard()" class="relative w-full min-h-[310px] sm:min-h-[340px] cursor-pointer select-none">
          <div class="w-full min-h-[310px] sm:min-h-[340px] transform-style-3d ${state.fcFlipped ? "rotate-y-180" : ""}">
            
            <!-- FRONT -->
            <div class="absolute inset-0 backface-hidden bg-white rounded-3xl p-6 sm:p-8 shadow-md border border-slate-200 flex flex-col items-center justify-between text-center">
              <div class="w-full flex items-center justify-between">
                <span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-rose-50 text-rose-800">${typeStr}</span>
                <div onclick="event.stopPropagation(); playAudioWithFallback('vocab_${card.id}_word.mp3', '${card.de.replace(/'/g, "\'")}', state.globalVoice, '${wordBtnId}')">
                  ${speakBtnHTML(wordBtnId, "w-11 h-11")}
                </div>
              </div>

              <div class="my-auto py-4">
                <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">${card.de}</h2>
                <p class="text-sm font-mono text-slate-400 mt-2">${card.ipa}</p>
              </div>

              <p class="text-xs font-medium text-slate-400">${t("fcFrontHint")}</p>
            </div>

            <!-- BACK -->
            <div class="absolute inset-0 backface-hidden rotate-y-180 bg-slate-900 text-white rounded-3xl p-6 sm:p-8 shadow-md border border-slate-800 flex flex-col justify-between">
              <div>
                <div class="flex items-start justify-between gap-2">
                  <div>
                    <p class="text-xs font-semibold text-amber-400 uppercase tracking-wider">${card.de}</p>
                    <h3 class="text-xl sm:text-2xl font-extrabold text-white mt-1">${meaningStr}</h3>
                  </div>
                  <button type="button" onclick="event.stopPropagation(); playAudioWithFallback('vocab_${card.id}_word.mp3', '${card.de.replace(/'/g, "\'")}', state.globalVoice, '${wordBtnId}')"
                    class="h-10 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200 flex items-center gap-1.5 shrink-0 cursor-pointer">
                    <span>🔊</span> <span>${t("fcWordBtn")}</span>
                  </button>
                </div>

                <p class="text-xs text-slate-300 bg-slate-800/80 p-3 rounded-xl mt-3 leading-relaxed">
                  <span class="font-semibold text-amber-300">${t("relatedPrefix")}</span> ${relStr}
                </p>

                <div class="mt-3 p-3.5 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-between gap-3">
                  <div class="min-w-0">
                    <p class="text-xs sm:text-sm font-semibold text-white leading-snug">${card.ex_de}</p>
                    <p class="text-xs text-slate-300 italic mt-1">${exTrans}</p>
                  </div>
                  <button type="button" onclick="event.stopPropagation(); playAudioWithFallback('vocab_${card.id}_ex.mp3', '${card.ex_de.replace(/'/g, "\'")}', state.globalVoice, '${exBtnId}')"
                    class="w-11 h-11 shrink-0 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 flex items-center justify-center font-bold cursor-pointer">
                    🔊
                  </button>
                </div>
              </div>

              <p class="text-center text-xs text-slate-400 mt-3">${t("fcBackHint")}</p>
            </div>

          </div>
        </div>
      `;

        syncPlayingButtonUI();
      }

      function flipFlashcard() {
        state.fcFlipped = !state.fcFlipped;
        renderFlashcard();
      }

      function nextFlashcard() {
        state.fcFlipped = false;
        state.fcIndex = (state.fcIndex + 1) % state.fcDeck.length;
        renderFlashcard();
      }

      function prevFlashcard() {
        state.fcFlipped = false;
        state.fcIndex =
          (state.fcIndex - 1 + state.fcDeck.length) % state.fcDeck.length;
        renderFlashcard();
      }

      function setFlashcardCategory(cat) {
        state.fcCategory = cat;
        state.fcFlipped = false;
        state.fcIndex = 0;
        state.fcDeck =
          cat === "all"
            ? [...VOCAB_DATA]
            : VOCAB_DATA.filter((v) => v.cat === cat);
        renderFlashcard();
      }

      function shuffleFlashcards() {
        for (let i = state.fcDeck.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [state.fcDeck[i], state.fcDeck[j]] = [
            state.fcDeck[j],
            state.fcDeck[i],
          ];
        }
        state.fcIndex = 0;
        state.fcFlipped = false;
        renderFlashcard();
      }

      function toggleFlashcardMastered() {
        const card = state.fcDeck[state.fcIndex];
        if (!card) return;
        const idx = state.masteredIds.indexOf(card.id);
        if (idx >= 0) {
          state.masteredIds.splice(idx, 1);
        } else {
          state.masteredIds.push(card.id);
        }
        localStorage.setItem(
          "fd_mastered_dieuduong",
          JSON.stringify(state.masteredIds),
        );
        renderFlashcard();
      }

      function renderNursingNotes() {
        document.getElementById("notesHeading").textContent = t("notesHeading");
        const items = t("notes") || [];
        document.getElementById("notesList").innerHTML = items
          .map(
            (n) => `
        <li class="p-3 rounded-xl bg-slate-50 border border-slate-100">${n}</li>
      `,
          )
          .join("");
      }

      // =========================================================================
      // 7. LANGUAGE SWITCHER (100% UI + CONTENT LOCALIZATION)
      // =========================================================================
      function setLanguage(lang) {
        state.lang = lang;
        localStorage.setItem("fd_lang", lang);
        document.documentElement.lang = lang;
        document.title = t("pageTitle");

        const viBtn = document.getElementById("langBtnVi");
        const enBtn = document.getElementById("langBtnEn");
        if (lang === "vi") {
          viBtn.className =
            "h-full px-2.5 rounded-lg text-xs font-bold transition cursor-pointer bg-emerald-500 text-slate-950 shadow-xs";
          enBtn.className =
            "h-full px-2.5 rounded-lg text-xs font-bold transition cursor-pointer text-slate-400 hover:text-white";
        } else {
          enBtn.className =
            "h-full px-2.5 rounded-lg text-xs font-bold transition cursor-pointer bg-emerald-500 text-slate-950 shadow-xs";
          viBtn.className =
            "h-full px-2.5 rounded-lg text-xs font-bold transition cursor-pointer text-slate-400 hover:text-white";
        }

        document.getElementById("backHomeText").textContent = t("backHomeText");
        document.getElementById("brandTitle").textContent = t("brandTitle");
        document.getElementById("popoverTitle").textContent =
          t("voiceSettingsTitle");
        document.getElementById("sheetTitle").textContent =
          t("voiceSettingsTitle");
        document.getElementById("vocabSearchInput").placeholder =
          t("searchPlaceholder");
        document.getElementById("workerVoiceLabel").textContent =
          t("workerVoiceLabel");
        document.getElementById("partnerVoiceLabel").textContent =
          t("partnerVoiceLabel");
        document.getElementById("fcShuffleText").textContent = t("fcShuffle");
        document.getElementById("fcPrevText").textContent = t("fcPrev");
        document.getElementById("fcNextText").textContent = t("fcNext");
        document.getElementById("fcShortcutHint").textContent =
          t("fcShortcutHint");

        renderNavigation();
        renderVoiceForms();
        renderVocab();
        renderPhrases();
        renderDialogues();
        renderFlashcard();
        renderNursingNotes();
      }

      // =========================================================================
      // 8. KEYBOARD SHORTCUTS
      // =========================================================================
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && state.voiceDrawerOpen) {
          closeVoiceDrawer();
          return;
        }
        if (
          ["INPUT", "SELECT", "TEXTAREA"].includes(
            document.activeElement.tagName,
          )
        )
          return;
        if (state.activeTab !== "flashcards") return;

        const card = state.fcDeck[state.fcIndex];
        if (!card) return;

        if (e.code === "Space") {
          e.preventDefault();
          flipFlashcard();
        } else if (e.key === "ArrowRight") {
          nextFlashcard();
        } else if (e.key === "ArrowLeft") {
          prevFlashcard();
        } else if (e.key.toLowerCase() === "s") {
          playAudioWithFallback(
            `vocab_${card.id}_word.mp3`,
            card.de,
            state.globalVoice,
            `fc_word_${card.id}`,
          );
        } else if (e.key.toLowerCase() === "e") {
          playAudioWithFallback(
            `vocab_${card.id}_ex.mp3`,
            card.ex_de,
            state.globalVoice,
            `fc_ex_${card.id}`,
          );
        }
      });

      // =========================================================================
      // 9. INITIALIZE APP
      // =========================================================================
      setLanguage(state.lang);
    </script>
  </body>
</html>
