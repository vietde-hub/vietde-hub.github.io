<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Fachdeutsch — Tiếng Đức Kỹ Thuật Viên Cốt Thép (Thợ buộc sắt) | BG Wind GmbH</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      min-height: 100dvh;
      padding-bottom: calc(76px + var(--safe-bottom));
    }
    @media (min-width: 768px) {
      body {
        padding-bottom: 40px;
      }
    }
    .bottom-nav-safe {
      padding-bottom: calc(6px + var(--safe-bottom));
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
    @keyframes pulseRing {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.45); }
      70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .btn-playing {
      background-color: #ef4444 !important;
      color: #ffffff !important;
      border-color: #ef4444 !important;
      animation: pulseRing 1.4s infinite;
    }
    @keyframes sheetSlideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .animate-sheet-up {
      animation: sheetSlideUp 0.26s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes popoverFade {
      from { opacity: 0; transform: translateY(-6px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-popover {
      animation: popoverFade 0.18s ease-out;
    }
  </style>
</head>
<body class="antialiased selection:bg-blue-200 selection:text-slate-900">

  <!-- =====================================================================
       ADAPTIVE STICKY TOP BAR (Back to Hub + Compact Mobile + 1-Row Desktop)
       ===================================================================== -->
  <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md text-white border-b border-slate-800 shadow-sm">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 h-14 flex items-center justify-between gap-2">
      
      <!-- Left: Back to Hub + Brand + Desktop Navigation Tabs -->
      <div class="flex items-center gap-2 sm:gap-3.5 min-w-0">
        <a href="index.html" id="backHomeBtn" title="Trang chủ / Home"
          class="h-9 px-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 hover:text-white text-xs font-semibold flex items-center gap-1 shrink-0 transition">
          <span>←</span>

        </a>

        <div class="flex items-center gap-2 min-w-0">

            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" />
            </svg>
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <span id="brandTitle" class="font-bold text-sm sm:text-base tracking-tight truncate">Ngành Cốt Thép</span>
              <span class="hidden xl:inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-semibold bg-blue-500/20 text-blue-300 border border-blue-500/30">BG Wind GmbH</span>
            </div>
          </div>
        </div>

        <!-- Desktop Single-Row Navigation Tabs (Hidden on Mobile) -->
        <nav id="desktopNav" class="hidden md:flex items-center gap-1 bg-slate-800/80 p-1 rounded-xl border border-slate-700/70" aria-label="Primary Navigation">
        </nav>
      </div>

      <!-- Right: Voice Settings Trigger Pill + VI/EN Switch -->
      <div class="flex items-center gap-1.5 sm:gap-2.5 shrink-0 relative">
        <button id="voiceTriggerBtn" type="button" onclick="toggleVoiceDrawer()"
          class="h-9 px-2.5 sm:px-3 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-700 text-xs font-medium text-slate-100 flex items-center gap-1.5 transition cursor-pointer">
          <span class="text-amber-400">🎙</span>
          <span id="voicePillLabel" class="max-w-[105px] sm:max-w-[160px] lg:max-w-[210px] truncate">Piper Chuẩn Đức • 1.0x</span>
          <svg class="w-3.5 h-3.5 text-slate-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        <!-- Language Switcher VI | EN -->
        <div class="h-9 bg-slate-800 p-0.5 rounded-xl border border-slate-700 flex items-center" role="group" aria-label="Language Switch">
          <button id="langBtnVi" type="button" onclick="setLanguage('vi')"
            class="h-full px-2.5 rounded-lg text-xs font-bold transition cursor-pointer">VI</button>
          <button id="langBtnEn" type="button" onclick="setLanguage('en')"
            class="h-full px-2.5 rounded-lg text-xs font-bold transition cursor-pointer">EN</button>
        </div>

        <!-- DESKTOP POPOVER: Voice & Speed Controls -->
        <div id="desktopVoicePopover" class="hidden md:hidden absolute right-0 top-12 w-80 bg-white text-slate-900 rounded-2xl shadow-2xl border border-slate-200 p-4 z-50 animate-popover">

            <span id="popoverTitle" class="text-xs font-bold uppercase tracking-wider text-slate-500">Cài đặt Giọng đọc & Tốc độ</span>
            <button type="button" onclick="closeVoiceDrawer()" class="w-7 h-7 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-400 hover:text-slate-700 cursor-pointer">✕</button>
          </div>
          <div id="desktopVoiceForm"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- Subtle Non-Blocking Audio Fallback / Status Banner -->
  <div id="statusToast" class="hidden fixed top-16 left-1/2 -translate-x-1/2 z-50 max-w-[92vw] sm:max-w-md bg-slate-900/95 text-white text-xs px-3.5 py-2 rounded-full shadow-lg border border-slate-700 flex items-center gap-2">
    <span class="w-2 h-2 rounded-full bg-amber-400 shrink-0"></span>
    <span id="statusToastText" class="truncate"></span>
  </div>

  <!-- =====================================================================
       MAIN CONTENT AREA
       ===================================================================== -->
  <main class="max-w-7xl mx-auto px-3 sm:px-6 pt-4 sm:pt-6">
    
    <!-- TAB 1: VOCABULARY -->
    <section id="section-vocab" class="space-y-4">
      <div class="bg-white rounded-2xl p-3 sm:p-4 shadow-sm border border-slate-200/80 space-y-3">
        <div class="relative">
          <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">

          </svg>
          <input id="vocabSearchInput" type="search" oninput="handleVocabSearch(this.value)"
            placeholder="Tìm từ tiếng Đức, nghĩa tiếng Việt..."
            class="w-full h-11 pl-10 pr-9 rounded-xl bg-slate-50 border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition" />
          <button id="clearSearchBtn" type="button" onclick="clearVocabSearch()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full bg-slate-200 text-slate-600 text-xs items-center justify-center hover:bg-slate-300 cursor-pointer">✕</button>
        </div>

        <div id="vocabCategoryPills" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5"></div>
      </div>

      <div id="vocabGrid" class="grid grid-cols-1 md:grid-cols-2 gap-3 sm:gap-4"></div>
    </section>

    <!-- TAB 2: WORKSHOP PHRASES -->
    <section id="section-phrases" class="hidden space-y-4">
      <div class="bg-white rounded-2xl p-3 sm:p-4 shadow-sm border border-slate-200/80">
        <div id="phraseCategoryPills" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar"></div>
      </div>
      <div id="phrasesList" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
    </section>

    <!-- TAB 3: DIALOGUES -->
    <section id="section-dialogues" class="hidden space-y-4">
      <div class="bg-white rounded-2xl p-3.5 sm:p-5 shadow-sm border border-slate-200/80 space-y-4">
        <div id="dialogueTabs" class="flex items-center gap-2 overflow-x-auto no-scrollbar"></div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2 border-t border-slate-100">
          <div>
            <label id="workerVoiceLabel" class="block text-xs font-semibold text-slate-600 mb-1">Giọng Kỹ thuật viên (Đức)</label>
            <select id="workerVoiceSelect" onchange="updateDialogueVoice('worker', this.value)"
              class="w-full h-10 px-3 rounded-xl bg-slate-50 border border-slate-200 text-xs sm:text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500">
            </select>
          </div>
          <div>
            <label id="partnerVoiceLabel" class="block text-xs font-semibold text-slate-600 mb-1">Giọng Tổ trưởng / Đồng nghiệp</label>
            <select id="partnerVoiceSelect" onchange="updateDialogueVoice('partner', this.value)"
              class="w-full h-10 px-3 rounded-xl bg-slate-50 border border-slate-200 text-xs sm:text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500">
            </select>
          </div>
        </div>
      </div>

      <div id="dialogueContainer" class="bg-white rounded-2xl p-4 sm:p-6 shadow-sm border border-slate-200/80"></div>
    </section>

    <!-- TAB 4: FLASHCARDS -->
    <section id="section-flashcards" class="hidden space-y-4 max-w-2xl mx-auto">
      <div class="bg-white rounded-2xl p-3 sm:p-4 shadow-sm border border-slate-200/80 flex flex-wrap items-center justify-between gap-2">
        <select id="fcCategorySelect" onchange="setFlashcardCategory(this.value)"
          class="h-10 px-3 rounded-xl bg-slate-50 border border-slate-200 text-xs sm:text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500">
        </select>
        <div class="flex items-center gap-2">
          <span id="fcCounter" class="text-xs font-bold text-slate-600 bg-slate-100 px-3 py-2 rounded-xl">1 / 56</span>
          <button id="fcShuffleBtn" type="button" onclick="shuffleFlashcards()"
            class="h-10 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold flex items-center gap-1.5 transition cursor-pointer">
            <span>🔀</span>
            <span id="fcShuffleText">Trộn thẻ</span>
          </button>
        </div>
      </div>

      <div id="flashcardStage" class="perspective-1000"></div>

      <div class="flex items-center justify-between gap-2">
        <button type="button" onclick="prevFlashcard()"
          class="h-11 px-4 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-sm font-semibold text-slate-700 shadow-sm flex items-center gap-1.5 cursor-pointer">
          <span>←</span>
          <span id="fcPrevText">Trước</span>
        </button>

        <button id="fcMasterBtn" type="button" onclick="toggleFlashcardMastered()"
          class="h-11 px-4 rounded-xl border text-xs sm:text-sm font-semibold shadow-sm flex items-center gap-1.5 transition cursor-pointer">
        </button>

        <button type="button" onclick="nextFlashcard()"
          class="h-11 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-sm font-semibold text-white shadow-sm flex items-center gap-1.5 cursor-pointer">
          <span id="fcNextText">Tiếp</span>
          <span>→</span>
        </button>
      </div>

      <p id="fcShortcutHint" class="hidden md:block text-center text-xs text-slate-400">
        Phím tắt: Space (Lật thẻ) • ← / → (Chuyển thẻ) • S (Nghe từ) • E (Nghe ví dụ)
      </p>
    </section>

  </main>

  <!-- MOBILE BOTTOM NAVIGATION BAR -->
  <nav id="mobileBottomNav" class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200 shadow-[0_-4px_16px_rgba(15,23,42,0.06)] bottom-nav-safe" aria-label="Mobile Navigation">
    <div id="mobileNavGrid" class="grid grid-cols-4 h-14"></div>

    <div class="w-10 h-1.5 rounded-full bg-slate-300 mx-auto mb-4"></div>
    <div class="flex items-center justify-between mb-3">
      <h3 id="sheetTitle" class="text-base font-bold text-slate-900">Cài đặt Giọng đọc & Tốc độ</h3>
      <button type="button" onclick="closeVoiceDrawer()" class="w-9 h-9 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center font-bold">✕</button>
    </div>
    <div id="mobileVoiceForm"></div>
  </div>

      { id: 26, cat: '1.2', de: 'der Grundriss (-e) / die Draufsicht', ipa: '/deːɐ̯ ˈɡʁʊntˌʁɪs/ / /diː ˈdʁaʊfˌzɪçt/', type_vi: 'Danh từ (m./f.)', type_en: 'Noun (m./f.)', vi: 'Bản vẽ mặt bằng / Hình chiếu bằng', en: 'Floor plan / Top view', rel_vi: 'der Riss (dt: hình vẽ kỹ thuật), die Sicht (dt: góc nhìn)', rel_en: 'der Riss (n: technical projection), die Sicht (n: view)', ex_de: 'Im Grundriss siehst du den runden Durchmesser vom Turmfundament.', ex_vi: 'Trên bản vẽ mặt bằng bạn sẽ thấy đường kính tròn của chân đế tuabin.', ex_en: 'In the plan view, you see the circular diameter of the tower foundation.' },
      { id: 27, cat: '1.2', de: 'der Schnitt (-e) / die Schnittzeichnung', ipa: '/deːɐ̯ ʃnɪt/ / /diː ˈʃnɪtˌtsaɪçnʊŋ/', type_vi: 'Danh từ (m./f.)', type_en: 'Noun (m./f.)', vi: 'Mặt cắt kỹ thuật trên bản vẽ', en: 'Cross-section / Sectional drawing', rel_vi: 'schneiden (đt: cắt), die Zeichnung (dt: bản vẽ)', rel_en: 'schneiden (v: to cut/section), die Zeichnung (n: drawing)', ex_de: 'In Schnitt A-A erkennt man die Höhe der oberen Bewehrung.', ex_vi: 'Ở mặt cắt A-A người ta thấy được cao độ của lớp cốt thép trên.', ex_en: 'In Section A-A, you can see the elevation of the top reinforcement.' },
      { id: 28, cat: '1.2', de: 'der Maßstab (-e)', ipa: '/deːɐ̯ ˈmaːsˌʃtaːp/', type_vi: 'Danh từ (m.)', type_en: 'Noun (m.)', vi: 'Tỷ lệ bản vẽ (ví dụ 1:50, 1:20)', en: 'Drawing scale (e.g., 1:50, 1:20)', rel_vi: 'das Maß (dt: kích thước), messen (đt: đo)', rel_en: 'das Maß (n: dimension), messen (v: to measure)', ex_de: 'Der Bewehrungsplan ist im Maßstab 1 zu 50 gezeichnet.', ex_vi: 'Bản vẽ cốt thép được vẽ theo tỷ lệ 1:50.', ex_en: 'The reinforcement drawing is drawn at a scale of 1 to 50.' },
      { id: 29, cat: '1.2', de: 'das Achsmaß (-e) / der Stababstand', ipa: '/das ˈaksˌmaːs/ / /deːɐ̯ ˈʃtaːpˌapʃtant/', type_vi: 'Danh từ (n./m.)', type_en: 'Noun (n./m.)', vi: 'Khoảng cách tim các thanh thép (bước thép)', en: 'Center-to-center spacing / Bar spacing', rel_vi: 'die Achse (dt: trục/tim), der Abstand (dt: khoảng cách)', rel_en: 'die Achse (n: axis/centerline), der Abstand (n: spacing/distance)', ex_de: 'Der Stababstand beträgt laut Plan genau 150 Millimeter.', ex_vi: 'Bước thép theo bản vẽ là chính xác 150 mm.', ex_en: 'According to the drawing, the bar spacing is exactly 150 millimeters.' },
      { id: 30, cat: '1.2', de: 'der Zollstock (-e) / das Maßband (-er)', ipa: '/deːɐ̯ ˈtsɔlˌʃtɔk/ / /das ˈmaːsˌbant/', type_vi: 'Danh từ (m./n.)', type_en: 'Noun (m./n.)', vi: 'Thước gấp / Thước dây cuộn', en: 'Folding ruler / Tape measure', rel_vi: 'messen (đt: đo), das Band (dt: dải thước)', rel_en: 'messen (v: to measure), das Band (n: tape)', ex_de: 'Miss den Abstand mit dem Zollstock genau nach.', ex_vi: 'Hãy đo kiểm tra lại khoảng cách bằng thước gấp cho chính xác.', ex_en: 'Double-check the spacing accurately with the folding ruler.' },
      { id: 31, cat: '1.2', de: 'die Schlagschnur (-e) / der Markierungsstift', ipa: '/diː ˈʃlaːkˌʃnuːɐ̯/ / /deːɐ̯ maʁˈkiːʁʊŋsˌʃtɪft/', type_vi: 'Danh từ (f./m.)', type_en: 'Noun (f./m.)', vi: 'Dây bật mực lấy dấu / Bút đánh dấu công nghiệp', en: 'Chalk line / Industrial marker', rel_vi: 'schlagen (đt: bật/đánh), markieren (đt: đánh dấu)', rel_en: 'schlagen (v: to snap/strike), markieren (v: to mark)', ex_de: 'Wir markieren die Achsen mit der Schlagschnur auf dem Beton.', ex_vi: 'Chúng ta đánh dấu các đường trục bằng dây bật mực trên nền bê tông.', ex_en: 'We mark the axes on the concrete using the chalk line.' },
      { id: 32, cat: '1.2', de: 'der Kran (-e) / die Anschlagkette (-n)', ipa: '/deːɐ̯ kʁaːn/ / /diː ˈanʃlaːkˌkɛtə/', type_vi: 'Danh từ (m./f.)', type_en: 'Noun (m./f.)', vi: 'Cần cẩu / Dây xích cẩu hàng', en: 'Crane / Lifting sling chain', rel_vi: 'anschlagen (đt: móc cáp cẩu), die Kette (dt: dây xích)', rel_en: 'anschlagen (v: to sling/rig), die Kette (n: chain)', ex_de: 'Hänge das Stahlbündel sicher in die Anschlagkette ein.', ex_vi: 'Hãy móc bó thép chắc chắn vào dây xích cẩu.', ex_en: 'Hook the steel bundle securely into the lifting chain.' },
      { id: 33, cat: '1.2', de: 'die Schalung (-en)', ipa: '/diː ˈʃaːlʊŋ/', type_vi: 'Danh từ (f.)', type_en: 'Noun (f.)', vi: 'Cốp pha / Ván khuôn đổ bê tông', en: 'Formwork / Concrete shuttering', rel_vi: 'einschalen (đt: lắp cốp pha), ausschalen (đt: tháo cốp pha)', rel_en: 'einschalen (v: to set up formwork), ausschalen (v: to strip formwork)', ex_de: 'Zwischen Bewehrung und Schalung muss genug Platz für die Abstandhalter sein.', ex_vi: 'Giữa cốt thép và cốp pha phải có đủ khoảng hở cho con kê.', ex_en: 'There must be enough clearance between the rebar and the formwork for the spacers.' },

      // 1.3 PPE & Construction Site Safety (9)
      { id: 34, cat: '1.3', de: 'der Schutzhelm (-e) mit Kinnriemen', ipa: '/deːɐ̯ ˈʃʊtsˌhɛlm/', type_vi: 'Danh từ (m.)', type_en: 'Noun (m.)', vi: 'Mũ bảo hộ lao động có quai cài cằm', en: 'Safety helmet with chin strap', rel_vi: 'schützen (đt: bảo vệ), der Helm (dt: mũ), der Riemen (dt: dây quai)', rel_en: 'schützen (v: to protect), der Helm (n: helmet), der Riemen (n: strap)', ex_de: 'Trage unter dem Kran immer deinen Schutzhelm mit geschlossenem Kinnriemen.', ex_vi: 'Dưới tầm cần cẩu, luôn đội mũ bảo hộ có cài chặt quai cằm.', ex_en: 'Always wear your safety helmet with the chin strap fastened under the crane.' },
      { id: 35, cat: '1.3', de: 'die Sicherheitsschuhe (Pl.) (S3)', ipa: '/diː ˈzɪçɐhaɪtsˌʃuːə/', type_vi: 'Danh từ (Pl.)', type_en: 'Noun (Pl.)', vi: 'Giày bảo hộ chống đinh & mũi thép chuẩn S3', en: 'S3 puncture-resistant safety boots', rel_vi: 'die Sicherheit (dt: sự an toàn), durchtrittsicher (tt: chống đâm xuyên)', rel_en: 'die Sicherheit (n: safety), durchtrittsicher (adj: puncture-resistant)', ex_de: 'Auf der Baustelle sind Sicherheitsschuhe der Klasse S3 Pflicht.', ex_vi: 'Trên công trường bắt buộc phải mang giày bảo hộ đạt chuẩn S3.', ex_en: 'Class S3 safety shoes are mandatory on the construction site.' },
      { id: 36, cat: '1.3', de: 'die Arbeitshandschuhe (Pl.) / die Flechterhandschuhe', ipa: '/diː ˈaʁbaɪtsˌhantʃuːə/', type_vi: 'Danh từ (Pl.)', type_en: 'Noun (Pl.)', vi: 'Găng tay bảo hộ thợ buộc sắt', en: 'Heavy-duty rebar tying work gloves', rel_vi: 'der Handschuh (dt: găng tay), greifen (đt: cầm nắm)', rel_en: 'der Handschuh (n: glove), greifen (v: to grip)', ex_de: 'Zieh dir feste Arbeitshandschuhe an, damit du dich nicht am Draht schneidest.', ex_vi: 'Hãy đeo găng tay bảo hộ dày dặn để không bị dây thép cắt vào tay.', ex_en: 'Put on sturdy work gloves so you do not cut yourself on the wire.' },
      { id: 37, cat: '1.3', de: 'die Schutzbrille (-n)', ipa: '/diː ˈʃʊtsˌbʁɪlə/', type_vi: 'Danh từ (f.)', type_en: 'Noun (f.)', vi: 'Kính bảo hộ (chống tia lửa & mạt sắt)', en: 'Safety glasses / Protective goggles', rel_vi: 'die Brille (dt: kính)', rel_en: 'die Brille (n: glasses)', ex_de: 'Beim Schneiden mit der Flex musst du unbedingt eine Schutzbrille tragen.', ex_vi: 'Khi cắt sắt bằng máy cắt cầm tay, bạn nhất định phải đeo kính bảo hộ.', ex_en: 'You must always wear safety glasses when cutting with the angle grinder.' },
      { id: 38, cat: '1.3', de: 'die Warnweste (-n) / die Warnschutzkleidung', ipa: '/diː ˈvaʁnˌvɛstə/', type_vi: 'Danh từ (f.)', type_en: 'Noun (f.)', vi: 'Áo phản quang bảo hộ', en: 'High-visibility vest / Hi-vis clothing', rel_vi: 'warnen (đt: cảnh báo), sichtbar (tt: dễ nhìn thấy)', rel_en: 'warnen (v: to warn), sichtbar (adj: visible)', ex_de: 'Ohne Warnweste darf niemand den Arbeitsbereich betreten.', ex_vi: 'Không ai được phép bước vào khu vực làm việc nếu không mặc áo phản quang.', ex_en: 'Nobody is allowed to enter the work zone without a high-visibility vest.' },
      { id: 39, cat: '1.3', de: 'der Gehörschutz', ipa: '/deːɐ̯ ɡəˈhøːɐ̯ˌʃʊts/', type_vi: 'Danh từ (m.)', type_en: 'Noun (m.)', vi: 'Nút bịt tai / Chụp tai chống ồn', en: 'Hearing protection / Ear defenders', rel_vi: 'hören (đt: nghe), das Gehör (dt: thính giác)', rel_en: 'hören (v: to hear), das Gehör (n: hearing)', ex_de: 'Wenn die Schneidemaschine läuft, benutze bitte deinen Gehörschutz.', ex_vi: 'Khi máy cắt sắt hoạt động, hãy sử dụng đồ bảo vệ thính giác của bạn.', ex_en: 'When the rebar cutting machine is running, please use your hearing protection.' },
      { id: 40, cat: '1.3', de: 'der Auffanggurt (-e) / die Absturzsicherung', ipa: '/deːɐ̯ ˈaʊfɡaŋˌɡʊʁt/ / /diː ˈapʃtʊʁtsˌzɪçəʁʊŋ/', type_vi: 'Danh từ (m./f.)', type_en: 'Noun (m./f.)', vi: 'Dây đai an toàn chống rơi ngã', en: 'Fall-arrest harness / Fall protection', rel_vi: 'auffangen (đt: đỡ lại), der Absturz (dt: sự rơi ngã)', rel_en: 'auffangen (v: to catch/arrest), der Absturz (n: fall from height)', ex_de: 'Sichere dich beim Arbeiten auf hohen Bewehrungskörben mit dem Auffanggurt.', ex_vi: 'Hãy thắt dây đai an toàn khi làm việc trên các lồng cốt thép cao.', ex_en: 'Secure yourself with the fall-arrest harness when working on tall rebar cages.' },
      { id: 41, cat: '1.3', de: 'das Gerüst (-e) / die Arbeitsbühne (-n)', ipa: '/das ɡəˈʁʏst/ / /diː ˈaʁbaɪtsˌbyːnə/', type_vi: 'Danh từ (n./f.)', type_en: 'Noun (n./f.)', vi: 'Giàn giáo / Sàn thao tác', en: 'Scaffolding / Working platform', rel_vi: 'einrüsten (đt: dựng giàn giáo), die Bühne (dt: sàn công tác)', rel_en: 'einrüsten (v: to scaffold), die Bühne (n: platform)', ex_de: 'Prüfe vor dem Aufsteigen, ob das Gerüst fest steht.', ex_vi: 'Trước khi trèo lên, hãy kiểm tra xem giàn giáo đã đứng vững chưa.', ex_en: 'Check whether the scaffolding is standing firmly before climbing up.' },
      { id: 42, cat: '1.3', de: 'die Stolpergefahr (-en)', ipa: '/diː ˈʃtɔlpɐɡəˌfaːɐ̯/', type_vi: 'Danh từ (f.)', type_en: 'Noun (f.)', vi: 'Nguy cơ vấp ngã (trên lưới thép)', en: 'Tripping hazard (on rebar mats)', rel_vi: 'stolpern (đt: vấp ngã), die Gefahr (dt: mối nguy hiểm)', rel_en: 'stolpern (v: to trip/stumble), die Gefahr (n: hazard/danger)', ex_de: 'Achte beim Laufen auf den Bewehrungsmatten auf die Stolpergefahr.', ex_vi: 'Khi đi lại trên các vỉ lưới thép, hãy chú ý nguy cơ vấp ngã.', ex_en: 'Watch out for the tripping hazard when walking across the rebar meshes.' },

      // 1.4 Technical Verbs & Adjectives (14)
      { id: 43, cat: '1.4', de: 'flechten / binden / rödeln', ipa: '/ˈflɛçtn̩/ / /ˈbɪndn̩/ / /ˈʁøːdl̩n/', type_vi: 'Động từ', type_en: 'Verb', vi: 'Buộc sắt / Xoắn dây kẽm cố định cốt thép', en: 'To tie rebar / To twist wire ties', rel_vi: 'der Flechter (dt: thợ buộc sắt), die Flechtarbeit (dt: công việc buộc sắt)', rel_en: 'der Flechter (n: rebar worker), die Flechtarbeit (n: steel-fixing work)', ex_de: 'Wir flechten jeden zweiten Kreuzungspunkt der Bewehrung fest.', ex_vi: 'Chúng ta buộc chặt cứ cách một giao điểm của lưới cốt thép.', ex_en: 'We tie every second intersection point of the reinforcement firmly.' },
      { id: 44, cat: '1.4', de: 'verlegen / einbauen', ipa: '/fɛɐ̯ˈleːɡn̩/ / /ˈaɪnˌbaʊən/', type_vi: 'Động từ', type_en: 'Verb', vi: 'Rải thép / Lắp đặt cốt thép vào vị trí', en: 'To lay / To place and install rebar', rel_vi: 'die Verlegung (dt: sự lắp đặt), der Einbau (dt: việc lắp ghép)', rel_en: 'die Verlegung (n: installation), der Einbau (n: assembly/placement)', ex_de: 'Morgen verlegen wir die radialen Stäbe im Fundament.', ex_vi: 'Ngày mai chúng ta sẽ rải các thanh thép hướng tâm trong chân đế.', ex_en: 'Tomorrow we will lay the radial bars in the foundation.' },
      { id: 45, cat: '1.4', de: 'biegen / abwinkeln', ipa: '/ˈbiːɡn̩/ / /ˈapˌvɪŋkl̩n/', type_vi: 'Động từ', type_en: 'Verb', vi: 'Uốn sắt / Bẻ góc thanh thép', en: 'To bend / To angle rebar', rel_vi: 'gebogen (tt: được uốn cong), der Winkel (dt: góc)', rel_en: 'gebogen (adj: bent), der Winkel (n: angle)', ex_de: 'Die Enden der Stäbe müssen nach Plan rechtwinklig abgewinkelt werden.', ex_vi: 'Các đầu thanh thép phải được bẻ vuông góc theo đúng bản vẽ.', ex_en: 'The ends of the bars must be bent at a right angle according to the plan.' },
      { id: 46, cat: '1.4', de: 'schneiden / ablängen', ipa: '/ˈʃnaɪdn̩/ / /ˈapˌlɛŋən/', type_vi: 'Động từ', type_en: 'Verb', vi: 'Cắt sắt / Cắt theo đúng kích thước', en: 'To cut / To cut to exact length', rel_vi: 'der Schnitt (dt: vết cắt), die Länge (dt: chiều dài)', rel_en: 'der Schnitt (n: cut), die Länge (n: length)', ex_de: 'Wir haben alle Stäbe für Position 5 schon abgelängt.', ex_vi: 'Chúng ta đã cắt đủ chiều dài cho toàn bộ các thanh thép mã số 5 rồi.', ex_en: 'We have already cut all bars for position 5 to length.' },
      { id: 47, cat: '1.4', de: 'messen / einmessen', ipa: '/ˈmɛsn̩/ / /ˈaɪnˌmɛsn̩/', type_vi: 'Động từ', type_en: 'Verb', vi: 'Đo đạc / Định vị tim cốt trên mặt bằng', en: 'To measure / To survey and lay out axes', rel_vi: 'die Messung (dt: phép đo), das Maß (dt: số đo)', rel_en: 'die Messung (n: measurement), das Maß (n: dimension)', ex_de: 'Der Polier misst jetzt die genaue Mitte vom Turmfundament ein.', ex_vi: 'Đốc công đang đo định vị chính xác tâm của chân đế tuabin.', ex_en: 'The foreman is now surveying the exact center of the tower foundation.' },
      { id: 48, cat: '1.4', de: 'ausrichten / kontrollieren', ipa: '/ˈaʊsˌʁɪçtn̩/ / /kɔntʁoˈliːʁən/', type_vi: 'Động từ', type_en: 'Verb', vi: 'Căn chỉnh thẳng hàng / Kiểm tra nghiệm thu', en: 'To align / To inspect', rel_vi: 'gerade (tt: thẳng), die Kontrolle (dt: sự kiểm tra)', rel_en: 'gerade (adj: straight), die Kontrolle (n: inspection)', ex_de: 'Richte den Bewehrungskorb genau nach der Markierung aus.', ex_vi: 'Hãy căn chỉnh lồng cốt thép thẳng khớp với vạch đánh dấu.', ex_en: 'Align the reinforcement cage precisely with the layout mark.' },
      { id: 49, cat: '1.4', de: 'befestigen / sichern', ipa: '/bəˈfɛstɪɡn̩/ / /ˈzɪçɐn/', type_vi: 'Động từ', type_en: 'Verb', vi: 'Cố định chắc chắn / Gia cố an toàn', en: 'To fasten / To secure', rel_vi: 'fest (tt: chắc chắn), sicher (tt: an toàn)', rel_en: 'fest (adj: tight/firm), sicher (adj: secure/safe)', ex_de: 'Befestige den Bindedraht so, dass nichts mehr verrutscht.', ex_vi: 'Hãy buộc cố định dây thép sao cho không còn gì bị xê dịch nữa.', ex_en: 'Fasten the tie wire so that nothing shifts out of place.' },
      { id: 50, cat: '1.4', de: 'abnehmen (die Bewehrung)', ipa: '/ˈapˌneːmən/', type_vi: 'Động từ (tách)', type_en: 'Verb (separable)', vi: 'Nghiệm thu cốt thép (trước khi đổ bê tông)', en: 'To inspect and sign off (reinforcement)', rel_vi: 'die Bewehrungsabnahme (dt: lễ nghiệm thu cốt thép)', rel_en: 'die Bewehrungsabnahme (n: rebar sign-off inspection)', ex_de: 'Bevor der Beton kommt, muss der Bauleiter die Bewehrung abnehmen.', ex_vi: 'Trước khi xe bê tông tới, kỹ sư trưởng phải nghiệm thu phần cốt thép.', ex_en: 'Before the concrete arrives, the site engineer must sign off on the reinforcement.' },
      { id: 51, cat: '1.4', de: 'betonieren / gießen', ipa: '/betoˈniːʁən/ / /ˈɡiːsn̩/', type_vi: 'Động từ', type_en: 'Verb', vi: 'Đổ bê tông', en: 'To pour concrete / To concrete', rel_vi: 'der Beton (dt: bê tông), die Betonage (dt: công tác đổ bê tông)', rel_en: 'der Beton (n: concrete), die Betonage (n: concreting)', ex_de: 'Nach der Abnahme beginnen wir sofort mit dem Betonieren.', ex_vi: 'Sau khi nghiệm thu xong, chúng ta bắt đầu đổ bê tông ngay.', ex_en: 'Right after sign-off, we start pouring concrete immediately.' },
      { id: 52, cat: '1.4', de: 'fest / locker', ipa: '/fɛst/ / /ˈlɔkɐ/', type_vi: 'Tính từ', type_en: 'Adjective', vi: 'Chắc chắn / Lỏng lẻo', en: 'Tight / Loose', rel_vi: 'festziehen (đt: siết chặt)', rel_en: 'festziehen (v: to tighten)', ex_de: 'Dieser Knoten ist noch locker, bitte zieh ihn noch einmal fest.', ex_vi: 'Mối buộc này vẫn còn lỏng, hãy siết chặt lại một lần nữa nhé.', ex_en: 'This tie knot is still loose; please tighten it once more.' },
      { id: 53, cat: '1.4', de: 'gerade / schief / gebogen', ipa: '/ɡəˈʁaːdə/ / /ʃiːf/ / /ɡəˈboːɡn̩/', type_vi: 'Tính từ', type_en: 'Adjective', vi: 'Thẳng / Bị lệch, nghiêng / Bị uốn cong', en: 'Straight / Crooked / Bent', rel_vi: 'begradigen (đt: nắn thẳng)', rel_en: 'begradigen (v: to straighten)', ex_de: 'Kontrolliere, ob alle vertikalen Stäbe ganz gerade stehen.', ex_vi: 'Kiểm tra xem tất cả các thanh thép đứng đã thẳng tắp chưa.', ex_en: 'Check whether all vertical bars are standing completely straight.' },
      { id: 54, cat: '1.4', de: 'senkrecht / waagerecht', ipa: '/ˈzɛŋkˌʁɛçt/ / /ˈvaːɡəˌʁɛçt/', type_vi: 'Tính từ', type_en: 'Adjective', vi: 'Thẳng đứng / Nằm ngang', en: 'Vertical (plumb) / Horizontal (level)', rel_vi: 'die Senkrechte (dt: đường thẳng đứng)', rel_en: 'die Senkrechte (n: vertical line)', ex_de: 'Die Ankerbolzen müssen absolut senkrecht ausgerichtet sein.', ex_vi: 'Các bu-lông neo phải được căn chỉnh thẳng đứng tuyệt đối.', ex_en: 'The anchor bolts must be aligned absolutely vertically.' },

    // =========================================================================
    // 4. AUDIO ENGINE WITH FALLBACK (audio/thobuocsat/<voice>/<file>)
    // =========================================================================
    function syncPlayingButtonUI() {
      document.querySelectorAll('[data-audio-btn]').forEach(btn => {
        const id = btn.getAttribute('data-audio-btn');
        const isCurrent = audioCtrl.activeBtnId === id;
        const iconPlay = btn.querySelector('.icon-play');
        const iconStop = btn.querySelector('.icon-stop');
        if (isCurrent) {
          btn.classList.add('btn-playing');
          if (iconPlay) iconPlay.classList.add('hidden');
          if (iconStop) iconStop.classList.remove('hidden');
        } else {
          btn.classList.remove('btn-playing');
          if (iconPlay) iconPlay.classList.remove('hidden');
          if (iconStop) iconStop.classList.add('hidden');
        }
      });

      const fullBtn = document.getElementById('playFullDialogueBtn');
      if (fullBtn) {
        if (audioCtrl.isFullDialoguePlaying) {
          fullBtn.classList.add('bg-red-600', 'hover:bg-red-700');
          fullBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
          fullBtn.innerHTML = `<span>■</span> <span>${t('stopFullDialogue')}</span>`;
        } else {
          fullBtn.classList.remove('bg-red-600', 'hover:bg-red-700');
          fullBtn.classList.add('bg-blue-600', 'hover:bg-blue-700');
          fullBtn.innerHTML = `<span>▶</span> <span>${t('playFullDialogue')}</span>`;
        }
      }

      document.querySelectorAll('[data-preview-btn]').forEach(btn => {
        const isPrev = audioCtrl.activeBtnId === 'preview_sample';
        if (isPrev) {
          btn.classList.add('bg-red-600', 'text-white');
          btn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
          btn.innerHTML = `<span>■</span> <span>${t('stopPreviewBtn')}</span>`;
        } else {
          btn.classList.remove('bg-red-600');
          btn.classList.add('bg-blue-600', 'hover:bg-blue-700', 'text-white');
          btn.innerHTML = `<span>🔊</span> <span>${t('previewVoiceBtn')}</span>`;
        }
      });
    }

    function stopAllAudio(resetDialogue = true) {
      if (resetDialogue) {
        audioCtrl.dialogueStopFlag = true;
        audioCtrl.isFullDialoguePlaying = false;
      }
      if (audioCtrl.element) {
        audioCtrl.element.pause();
        audioCtrl.element.src = '';
        audioCtrl.element = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      audioCtrl.activeBtnId = null;
      document.querySelectorAll('.dialogue-line-active').forEach(el => {
        el.classList.remove('dialogue-line-active', 'ring-2', 'ring-blue-500', 'bg-blue-50/70');
      });
      syncPlayingButtonUI();
    }

    function playAudioWithFallback(fileName, fallbackText, voiceId, btnId, onEndedCallback = null) {
      if (audioCtrl.activeBtnId === btnId) {
        stopAllAudio(true);
        return;
      }

      stopAllAudio(false);
      audioCtrl.activeBtnId = btnId;
      syncPlayingButtonUI();

      const chain = [voiceId, 'piper_hochdeutsch', 'edge_hochdeutsch'].filter((v, idx, arr) => v && arr.indexOf(v) === idx);
      let attemptIdx = 0;

      const finishPlayback = () => {
        audioCtrl.activeBtnId = null;
        audioCtrl.element = null;
        syncPlayingButtonUI();
        if (onEndedCallback) onEndedCallback();
      };

      const tryNextSource = () => {
        if (attemptIdx >= chain.length) {
          if ('speechSynthesis' in window && fallbackText) {
            const utter = new SpeechSynthesisUtterance(fallbackText);
            utter.lang = 'de-DE';
            utter.rate = state.speed;
            utter.onend = finishPlayback;
            utter.onerror = finishPlayback;
            window.speechSynthesis.speak(utter);
          } else {
            finishPlayback();
          }
          return;
        }

        const currentVoice = chain[attemptIdx];
        const src = `${AUDIO_BASE_PATH}/${currentVoice}/${fileName}`;
        const audio = new Audio(src);
        audio.playbackRate = state.speed;
        audioCtrl.element = audio;

        audio.onended = finishPlayback;
        audio.onerror = () => {
          if (attemptIdx === 0 && currentVoice !== 'piper_hochdeutsch') {
            showToast(t('fallbackNotice'));
          }
          attemptIdx++;
          tryNextSource();
        };

        audio.play().catch(() => {
          attemptIdx++;
          tryNextSource();
        });
      };

      tryNextSource();
    }

    async function toggleFullDialogue() {
      if (audioCtrl.isFullDialoguePlaying) {
        stopAllAudio(true);
        return;
      }
      const dlg = DIALOGUES_DATA.find(d => d.id === state.activeDialogueId);
      if (!dlg) return;

      stopAllAudio(true);
      audioCtrl.isFullDialoguePlaying = true;
      audioCtrl.dialogueStopFlag = false;
      syncPlayingButtonUI();

      for (let i = 0; i < dlg.lines.length; i++) {
        if (audioCtrl.dialogueStopFlag) break;
        const line = dlg.lines[i];
        const lineNum = i + 1;
        const btnId = `dlg_${dlg.id}_line_${lineNum}`;
        const voice = line.role === 'worker' ? state.workerVoice : state.partnerVoice;

        document.querySelectorAll('.dialogue-line-active').forEach(el => {
          el.classList.remove('dialogue-line-active', 'ring-2', 'ring-blue-500', 'bg-blue-50/70');
        });
        const rowEl = document.getElementById(`row_${btnId}`);
        if (rowEl) {
          rowEl.classList.add('dialogue-line-active', 'ring-2', 'ring-blue-500', 'bg-blue-50/70');
          rowEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        await new Promise(resolve => {
          playAudioWithFallback(`dialog_${dlg.id}_line_${lineNum}.mp3`, line.de, voice, btnId, resolve);
        });

        if (!audioCtrl.dialogueStopFlag && i < dlg.lines.length - 1) {
          await new Promise(r => setTimeout(r, 350));
        }
      }

      stopAllAudio(true);
    }

              ${state.lang === 'en' ? v.label_en : v.label_vi}

        return `
          <article class="bg-white rounded-2xl p-4 sm:p-5 shadow-xs border border-slate-200/80 hover:border-blue-300 transition flex flex-col justify-between gap-3.5">
            <div>
              <div class="flex items-start justify-between gap-3">
                <div class="min-w-0">
                  <div class="flex flex-wrap items-center gap-2">
                    <h2 class="text-base sm:text-lg font-bold text-slate-900 leading-snug">${item.de}</h2>
                    <span class="px-2 py-0.5 rounded-md text-[11px] font-semibold bg-blue-50 text-blue-700 border border-blue-100">${typeStr}</span>
                  </div>
                  <p class="text-xs font-mono text-slate-400 mt-0.5">${item.ipa}</p>
                  <p class="text-sm sm:text-base font-bold text-emerald-700 mt-1.5">${meaningStr}</p>
                </div>
                <div onclick="playAudioWithFallback('vocab_${item.id}_word.mp3', '${item.de.replace(/'/g, "\\'")}', state.globalVoice, '${wordBtnId}')">
                  ${speakBtnHTML(wordBtnId, 'w-11 h-11')}
                </div>
              </div>

              <div class="mt-2.5 px-3 py-2 rounded-xl bg-slate-50 border border-slate-100 text-xs text-slate-600 leading-relaxed">
                <span class="font-semibold text-slate-700">${t('relatedPrefix')}</span> ${relStr}
              </div>
            </div>

            <div class="p-3 rounded-xl bg-amber-50/70 border border-amber-200/60 flex items-center justify-between gap-3">
              <div class="min-w-0">
                <p class="text-xs sm:text-sm font-semibold text-slate-800 leading-snug">${item.ex_de}</p>
                <p class="text-xs text-slate-600 italic mt-0.5 leading-snug">${exTrans}</p>
              </div>
              <div onclick="playAudioWithFallback('vocab_${item.id}_ex.mp3', '${item.ex_de.replace(/'/g, "\\'")}', state.globalVoice, '${exBtnId}')">
                ${speakBtnHTML(exBtnId, 'w-11 h-11 bg-amber-100/80 hover:bg-amber-200/80 text-amber-800 border-amber-200')}
              </div>
            </div>
          </article>
        `;
      }).join('');

      syncPlayingButtonUI();
    }

    function setVocabCategory(cat) {
      state.vocabCategory = cat;
      renderVocab();
    }

    function handleVocabSearch(val) {
      state.vocabQuery = val;
      const clearBtn = document.getElementById('clearSearchBtn');
      if (clearBtn) {
        clearBtn.classList.toggle('hidden', !val);
        clearBtn.classList.toggle('flex', Boolean(val));
      }
      renderVocab();
    }

    function clearVocabSearch() {
      const input = document.getElementById('vocabSearchInput');
      if (input) input.value = '';
      handleVocabSearch('');
    }

    function renderPhrases() {
      const cats = [
        { id: 'all', label: t('pcat_all') },
        { id: '2.1', label: t('pcat_2_1') },
        { id: '2.2', label: t('pcat_2_2') },
        { id: '2.3', label: t('pcat_2_3') },
        { id: '2.4', label: t('pcat_2_4') }
      ];

      document.getElementById('phraseCategoryPills').innerHTML = cats.map(c => `
        <button type="button" onclick="setPhraseCategory('${c.id}')"
          class="px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition cursor-pointer ${state.phraseCategory === c.id ? 'bg-blue-600 text-white shadow-xs' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
          ${c.label}
        </button>
      `).join('');

      const filtered = PHRASES_DATA.filter(p => state.phraseCategory === 'all' || p.cat === state.phraseCategory);
      document.getElementById('phrasesList').innerHTML = filtered.map(p => {
        const trans = state.lang === 'en' ? p.en : p.vi;
        const btnId = `phrase_${p.id}`;
        return `
          <div class="bg-white rounded-2xl p-4 shadow-xs border border-slate-200/80 hover:border-blue-300 transition flex items-center justify-between gap-3.5">
            <div class="min-w-0">
              <span class="inline-block text-[11px] font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md mb-1">${p.cat}</span>
              <p class="text-sm sm:text-base font-bold text-slate-900 leading-snug">${p.de}</p>
              <p class="text-xs sm:text-sm text-slate-600 mt-1">${trans}</p>
            </div>
            <div onclick="playAudioWithFallback('phrase_${p.id}.mp3', '${p.de.replace(/'/g, "\\'")}', state.globalVoice, '${btnId}')">
              ${speakBtnHTML(btnId, 'w-11 h-11')}
            </div>
          </div>
        `;
      }).join('');

      syncPlayingButtonUI();
    }

    function setPhraseCategory(cat) {
      state.phraseCategory = cat;
      renderPhrases();
    }

    function renderDialogues() {
      document.getElementById('dialogueTabs').innerHTML = DIALOGUES_DATA.map(d => {
        const label = state.lang === 'en' ? d.tab_en : d.tab_vi;
        const active = d.id === state.activeDialogueId;
        return `
          <button type="button" onclick="selectDialogue(${d.id})"
            class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition cursor-pointer ${active ? 'bg-slate-900 text-white shadow-xs' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
            ${label}
          </button>
        `;
      }).join('');

      const dlg = DIALOGUES_DATA.find(d => d.id === state.activeDialogueId) || DIALOGUES_DATA[0];
      const title = state.lang === 'en' ? dlg.title_en : dlg.title_vi;
      const context = state.lang === 'en' ? dlg.context_en : dlg.context_vi;

      document.getElementById('dialogueContainer').innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 mb-4 border-b border-slate-100">
          <div>
            <h2 class="text-base sm:text-lg font-bold text-slate-900">${title}</h2>
            <p class="text-xs sm:text-sm text-slate-500 mt-0.5">${context}</p>
          </div>
          <button id="playFullDialogueBtn" type="button" onclick="toggleFullDialogue()"
            class="h-11 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs sm:text-sm font-bold flex items-center justify-center gap-2 shrink-0 shadow-xs transition cursor-pointer">
            <span>▶</span> <span>${t('playFullDialogue')}</span>
          </button>
        </div>

        <div class="space-y-3">
          ${dlg.lines.map((line, idx) => {
            const lineNum = idx + 1;
            const btnId = `dlg_${dlg.id}_line_${lineNum}`;
            const speakerName = state.lang === 'en' ? line.name_en : line.name_vi;
            const lineTrans = state.lang === 'en' ? line.en : line.vi;
            const isWorker = line.role === 'worker';
            const voiceForLine = isWorker ? state.workerVoice : state.partnerVoice;

            return `
              <div id="row_${btnId}" class="p-3.5 sm:p-4 rounded-2xl border transition flex items-start justify-between gap-3 ${isWorker ? 'bg-slate-50/90 border-slate-200/80' : 'bg-amber-50/50 border-amber-200/60'}">
                <div class="min-w-0">
                  <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-bold mb-1 ${isWorker ? 'bg-blue-100 text-blue-800' : 'bg-amber-200/80 text-amber-900'}">
                    ${speakerName}
                  </span>
                  <p class="text-sm sm:text-base font-bold text-slate-900 leading-snug">${line.de}</p>
                  <p class="text-xs sm:text-sm text-slate-600 mt-1">${lineTrans}</p>
                </div>
                <div onclick="playAudioWithFallback('dialog_${dlg.id}_line_${lineNum}.mp3', '${line.de.replace(/'/g, "\\'")}', '${voiceForLine}', '${btnId}')">
                  ${speakBtnHTML(btnId, 'w-11 h-11')}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;

      syncPlayingButtonUI();
    }

    function selectDialogue(id) {
      stopAllAudio(true);
      state.activeDialogueId = id;
      renderDialogues();
    }

    function renderFlashcardControls() {
      const opts = [
        { id: 'all', label: t('fcAllCategories') },
        { id: '1.1', label: t('cat_1_1') },
        { id: '1.2', label: t('cat_1_2') },
        { id: '1.3', label: t('cat_1_3') },
        { id: '1.4', label: t('cat_1_4') }
      ];
      document.getElementById('fcCategorySelect').innerHTML = opts.map(o => `
        <option value="${o.id}" ${o.id === state.fcCategory ? 'selected' : ''}>${o.label}</option>
      `).join('');
    }

    function renderFlashcard() {
      renderFlashcardControls();
      if (state.fcDeck.length === 0) state.fcDeck = [...VOCAB_DATA];
      if (state.fcIndex >= state.fcDeck.length) state.fcIndex = 0;

      const card = state.fcDeck[state.fcIndex];
      const typeStr = state.lang === 'en' ? card.type_en : card.type_vi;
      const meaningStr = state.lang === 'en' ? card.en : card.vi;
      const relStr = state.lang === 'en' ? card.rel_en : card.rel_vi;
      const exTrans = state.lang === 'en' ? card.ex_en : card.ex_vi;
      const isMastered = state.masteredIds.includes(card.id);

      document.getElementById('fcCounter').textContent = `${state.fcIndex + 1} / ${state.fcDeck.length}`;

      const masterBtn = document.getElementById('fcMasterBtn');
      if (isMastered) {
        masterBtn.className = 'h-11 px-4 rounded-xl border border-emerald-300 bg-emerald-50 text-emerald-700 text-xs sm:text-sm font-bold shadow-xs flex items-center gap-1.5 transition cursor-pointer';
        masterBtn.innerHTML = `<span>✓</span> <span>${t('fcMastered')}</span>`;
      } else {
        masterBtn.className = 'h-11 px-4 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs sm:text-sm font-semibold shadow-xs flex items-center gap-1.5 transition cursor-pointer';
        masterBtn.innerHTML = `<span>○</span> <span>${t('fcMarkMastered')}</span>`;
      }

      const wordBtnId = `fc_word_${card.id}`;
      const exBtnId = `fc_ex_${card.id}`;

      document.getElementById('flashcardStage').innerHTML = `
        <div onclick="flipFlashcard()" class="relative w-full min-h-[310px] sm:min-h-[340px] cursor-pointer select-none">
          <div class="w-full min-h-[310px] sm:min-h-[340px] transform-style-3d ${state.fcFlipped ? 'rotate-y-180' : ''}">
            
            <!-- FRONT -->
            <div class="absolute inset-0 backface-hidden bg-white rounded-3xl p-6 sm:p-8 shadow-md border border-slate-200 flex flex-col items-center justify-between text-center">
              <div class="w-full flex items-center justify-between">
                <span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-blue-50 text-blue-700">${typeStr}</span>
                <div onclick="event.stopPropagation(); playAudioWithFallback('vocab_${card.id}_word.mp3', '${card.de.replace(/'/g, "\\'")}', state.globalVoice, '${wordBtnId}')">
                  ${speakBtnHTML(wordBtnId, 'w-11 h-11')}
                </div>
              </div>

              <div class="my-auto py-4">
                <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">${card.de}</h2>
                <p class="text-sm font-mono text-slate-400 mt-2">${card.ipa}</p>
              </div>

              <p class="text-xs font-medium text-slate-400">${t('fcFrontHint')}</p>
            </div>

            <!-- BACK -->
            <div class="absolute inset-0 backface-hidden rotate-y-180 bg-slate-900 text-white rounded-3xl p-6 sm:p-8 shadow-md border border-slate-800 flex flex-col justify-between">
              <div>
                <div class="flex items-start justify-between gap-2">
                  <div>
                    <p class="text-xs font-semibold text-amber-400 uppercase tracking-wider">${card.de}</p>
                    <h3 class="text-xl sm:text-2xl font-extrabold text-white mt-1">${meaningStr}</h3>
                  </div>
                  <button type="button" onclick="event.stopPropagation(); playAudioWithFallback('vocab_${card.id}_word.mp3', '${card.de.replace(/'/g, "\\'")}', state.globalVoice, '${wordBtnId}')"
                    class="h-10 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200 flex items-center gap-1.5 shrink-0 cursor-pointer">
                    <span>🔊</span> <span>${t('fcWordBtn')}</span>
                  </button>
                </div>

                <p class="text-xs text-slate-300 bg-slate-800/80 p-3 rounded-xl mt-3 leading-relaxed">
                  <span class="font-semibold text-amber-300">${t('relatedPrefix')}</span> ${relStr}
                </p>

                <div class="mt-3 p-3.5 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-between gap-3">
                  <div class="min-w-0">
                    <p class="text-xs sm:text-sm font-semibold text-white leading-snug">${card.ex_de}</p>
                    <p class="text-xs text-slate-300 italic mt-1">${exTrans}</p>
                  </div>
                  <button type="button" onclick="event.stopPropagation(); playAudioWithFallback('vocab_${card.id}_ex.mp3', '${card.ex_de.replace(/'/g, "\\'")}', state.globalVoice, '${exBtnId}')"
                    class="w-11 h-11 shrink-0 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 flex items-center justify-center font-bold cursor-pointer">
                    🔊
                  </button>
                </div>
              </div>

              <p class="text-center text-xs text-slate-400 mt-3">${t('fcBackHint')}</p>
            </div>

          </div>
        </div>
      `;

      syncPlayingButtonUI();
    }

    function flipFlashcard() {
      state.fcFlipped = !state.fcFlipped;
      renderFlashcard();
    }

    function nextFlashcard() {
      state.fcFlipped = false;
      state.fcIndex = (state.fcIndex + 1) % state.fcDeck.length;
      renderFlashcard();
    }

    function prevFlashcard() {
      state.fcFlipped = false;
      state.fcIndex = (state.fcIndex - 1 + state.fcDeck.length) % state.fcDeck.length;
      renderFlashcard();
    }

    function setFlashcardCategory(cat) {
      state.fcCategory = cat;
      state.fcFlipped = false;
      state.fcIndex = 0;
      state.fcDeck = cat === 'all' ? [...VOCAB_DATA] : VOCAB_DATA.filter(v => v.cat === cat);
      renderFlashcard();
    }

    function shuffleFlashcards() {
      for (let i = state.fcDeck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [state.fcDeck[i], state.fcDeck[j]] = [state.fcDeck[j], state.fcDeck[i]];
      }
      state.fcIndex = 0;
      state.fcFlipped = false;
      renderFlashcard();
    }

    function toggleFlashcardMastered() {
      const card = state.fcDeck[state.fcIndex];
      if (!card) return;
      const idx = state.masteredIds.indexOf(card.id);
      if (idx >= 0) {
        state.masteredIds.splice(idx, 1);
      } else {
        state.masteredIds.push(card.id);
      }
      localStorage.setItem('fd_mastered_thobuocsat', JSON.stringify(state.masteredIds));
      renderFlashcard();
    }

    // =========================================================================
    // 7. LANGUAGE SWITCHER (100% UI + CONTENT LOCALIZATION)
    // =========================================================================
    function setLanguage(lang) {
      state.lang = lang;
      localStorage.setItem('fd_lang', lang);
      document.documentElement.lang = lang;

      const viBtn = document.getElementById('langBtnVi');
      const enBtn = document.getElementById('langBtnEn');
      if (lang === 'vi') {
        viBtn.className = 'h-full px-2.5 rounded-lg text-xs font-bold transition cursor-pointer bg-emerald-500 text-slate-950 shadow-xs';
        enBtn.className = 'h-full px-2.5 rounded-lg text-xs font-bold transition cursor-pointer text-slate-400 hover:text-white';
      } else {
        enBtn.className = 'h-full px-2.5 rounded-lg text-xs font-bold transition cursor-pointer bg-emerald-500 text-slate-950 shadow-xs';
        viBtn.className = 'h-full px-2.5 rounded-lg text-xs font-bold transition cursor-pointer text-slate-400 hover:text-white';
      }

      document.getElementById('backHomeText').textContent = t('backHomeText');
      document.getElementById('brandTitle').textContent = t('brandTitle');
      document.getElementById('popoverTitle').textContent = t('voiceSettingsTitle');
      document.getElementById('sheetTitle').textContent = t('voiceSettingsTitle');
      document.getElementById('vocabSearchInput').placeholder = t('searchPlaceholder');
      document.getElementById('workerVoiceLabel').textContent = t('workerVoiceLabel');
      document.getElementById('partnerVoiceLabel').textContent = t('partnerVoiceLabel');
      document.getElementById('fcShuffleText').textContent = t('fcShuffle');
      document.getElementById('fcPrevText').textContent = t('fcPrev');
      document.getElementById('fcNextText').textContent = t('fcNext');
      document.getElementById('fcShortcutHint').textContent = t('fcShortcutHint');

      renderNavigation();
      renderVoiceForms();
      renderVocab();
      renderPhrases();
      renderDialogues();
      renderFlashcard();
    }

    // =========================================================================
    // 8. KEYBOARD SHORTCUTS
    // =========================================================================
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && state.voiceDrawerOpen) {
        closeVoiceDrawer();
        return;
      }
      if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
      if (state.activeTab !== 'flashcards') return;

      const card = state.fcDeck[state.fcIndex];
      if (!card) return;

      if (e.code === 'Space') {
        e.preventDefault();
        flipFlashcard();
      } else if (e.key === 'ArrowRight') {
        nextFlashcard();
      } else if (e.key === 'ArrowLeft') {
        prevFlashcard();
      } else if (e.key.toLowerCase() === 's') {
        playAudioWithFallback(`vocab_${card.id}_word.mp3`, card.de, state.globalVoice, `fc_word_${card.id}`);
      } else if (e.key.toLowerCase() === 'e') {
        playAudioWithFallback(`vocab_${card.id}_ex.mp3`, card.ex_de, state.globalVoice, `fc_ex_${card.id}`);
      }
    });

    // =========================================================================
    // 9. INITIALIZE APP
    // =========================================================================
    setLanguage(state.lang);
  </script>
</body>
</html>
